<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단톡 정리함</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #fbfbfd;
  --line: #e3e6ec;
  --line-soft: #eef0f4;
  --text: #1b1f27;
  --text-2: #5c6474;
  --text-3: #949bab;
  --accent: #3d5afe;
  --accent-soft: #eaeeff;
  --warn: #b26a00;
  --warn-soft: #fff5e2;
  --good: #0f7b5f;
  --good-soft: #e6f5ef;
  --mark: #fff2a8;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16,20,30,.05), 0 6px 18px rgba(16,20,30,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b;
    --panel: #1c1f26;
    --panel-2: #21242c;
    --line: #2e333d;
    --line-soft: #262a33;
    --text: #e8eaf0;
    --text-2: #a3aab9;
    --text-3: #767e8e;
    --accent: #8ba3ff;
    --accent-soft: #232a44;
    --warn: #e5ac52;
    --warn-soft: #33291a;
    --good: #5cc9a3;
    --good-soft: #17302a;
    --mark: #5c5320;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }

/* 레이아웃 */
#app { display: flex; flex-direction: column; height: 100vh; }
header.top { flex: none; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px 0; }
.brand {
  font-weight: 700; font-size: 15px; letter-spacing: -.02em;
  display: flex; align-items: center; gap: 7px; flex: none;
}
.brand .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); }

/* 방 탭 */
.rooms { display: flex; gap: 4px; align-items: center; flex: 1 1 auto; overflow-x: auto; padding-bottom: 2px; }
.rooms::-webkit-scrollbar { height: 0; }
.room-tab {
  border: 1px solid transparent; background: transparent;
  padding: 6px 10px; border-radius: 8px; white-space: nowrap;
  color: var(--text-2); font-weight: 600; font-size: 13px;
  display: flex; align-items: center; gap: 7px;
}
.room-tab:hover { background: var(--panel-2); color: var(--text); }
.room-tab.on { background: var(--accent-soft); color: var(--accent); }
.room-tab .cnt { font-weight: 500; font-size: 11px; color: var(--text-3); }
.room-tab.on .cnt { color: var(--accent); opacity: .8; }
.room-tab .x { opacity: 0; font-size: 15px; line-height: 1; color: var(--text-3); }
.room-tab:hover .x { opacity: .7; }

.btn {
  border: 1px solid var(--line); background: var(--panel);
  padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--text-2); white-space: nowrap;
}
.btn:hover { border-color: var(--text-3); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.sm { padding: 3px 9px; font-size: 12px; border-radius: 7px; }

/* 뷰 탭 */
.views { display: flex; gap: 2px; padding: 8px 16px 0; }
.view-tab {
  border: 0; background: transparent; padding: 8px 4px; margin-right: 18px;
  font-weight: 600; font-size: 13px; color: var(--text-3);
  border-bottom: 2px solid transparent;
}
.view-tab.on { color: var(--text); border-bottom-color: var(--accent); }
.view-tab:hover { color: var(--text); }

main { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; }
.pane-left {
  flex: none; width: 400px; border-right: 1px solid var(--line);
  background: var(--panel); display: flex; flex-direction: column; min-height: 0;
}
.pane-right { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.pane-head {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  font-size: 12px; font-weight: 600; color: var(--text-2);
}
.pane-head .spacer { flex: 1; }
.scroll { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
.scroll::-webkit-scrollbar { width: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 3px solid var(--panel); }
.pane-right .scroll::-webkit-scrollbar-thumb { border-color: var(--bg); }

/* 날짜 목록 / 요약 카드 */
.day { border-bottom: 1px solid var(--line-soft); }
.day-head {
  width: 100%; text-align: left; border: 0; background: transparent;
  padding: 11px 14px; display: flex; align-items: baseline; gap: 8px;
}
.day-head:hover { background: var(--panel-2); }
.day.on .day-head { background: var(--accent-soft); }
.day-date { font-weight: 700; font-size: 13px; letter-spacing: -.01em; }
.day.on .day-date { color: var(--accent); }
.day-meta { font-size: 11px; color: var(--text-3); margin-left: auto; white-space: nowrap; }
.day-topics { display: none; padding: 2px 10px 12px; }
.day.open .day-topics { display: block; }

/* 새로 들어온 날과 예전 날의 경계 */
.new-rule {
  width: 100%; display: flex; align-items: center; gap: 8px; border: 0;
  background: var(--accent-soft); color: var(--accent);
  padding: 6px 14px; font-size: 11px; font-weight: 700;
  border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
}
.new-rule .x { margin-left: auto; font-weight: 600; opacity: .65; }
.new-rule:hover .x { opacity: 1; text-decoration: underline; }

.topic {
  width: 100%; text-align: left; border: 1px solid var(--line-soft);
  background: var(--panel-2); border-radius: var(--radius);
  padding: 9px 11px; margin-bottom: 6px; display: block;
}
.topic:hover { border-color: var(--accent); }
.topic.on { border-color: var(--accent); background: var(--accent-soft); }
.topic-title { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; }
.topic-body { font-size: 12px; color: var(--text-2); line-height: 1.5; }
.topic-body ul { margin: 0; padding-left: 15px; }
.topic-body li { margin: 0 0 2px; }
.topic-meta { font-size: 10.5px; color: var(--text-3); margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
.topic-meta .tag {
  font-weight: 700; padding: 0 5px; border-radius: 4px;
  background: var(--accent-soft); color: var(--accent);
}
.topic-meta .tag.cat { background: var(--line-soft); color: var(--text-2); }

/* 오른쪽 정리 패널 */
.right-body { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; }
.digest {
  flex: none; width: 380px; border-left: 1px solid var(--line);
  background: var(--panel); overflow-y: auto; padding: 16px 16px 40vh;
}
.digest h3 {
  margin: 0 0 4px; font-size: 15px; letter-spacing: -.02em; line-height: 1.45;
}
.digest .sub { font-size: 11.5px; color: var(--text-3); margin-bottom: 14px; }
.digest .sec {
  font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .02em;
  margin: 16px 0 7px; padding-bottom: 5px; border-bottom: 1px solid var(--line-soft);
}
.quote {
  width: 100%; text-align: left; border: 0; background: transparent;
  border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 10px; display: block;
}
.quote:hover { border-left-color: var(--accent); }
.quote .q-who { font-size: 11px; font-weight: 700; color: var(--text-3); margin-bottom: 2px; }
.quote .q-text { font-size: 12.5px; color: var(--text-2); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.digest .stat { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; }
.digest .stat b { font-weight: 700; }
.digest .mini {
  width: 100%; text-align: left; border: 0; background: transparent; display: block;
  font-size: 12.5px; color: var(--text-2); padding: 4px 0; line-height: 1.45;
}
.digest .mini:hover { color: var(--accent); }
.digest .mini .t { font-size: 10.5px; color: var(--text-3); margin-right: 6px; }
@media (max-width: 1240px) { .digest { display: none; } }

/* 대화 */
.chat { padding: 14px 18px 60vh; max-width: 880px; }
.msg { display: flex; gap: 10px; padding: 4px 8px; border-radius: 8px; scroll-margin-top: 20px; }
.msg + .msg { margin-top: 2px; }
.msg.hl { background: var(--mark); }
.msg.dim { opacity: .38; }
.msg-side { flex: none; width: 60px; text-align: right; font-size: 10.5px; color: var(--text-3); padding-top: 3px; }
.msg-main { flex: 1 1 auto; min-width: 0; }
.msg-who { font-weight: 700; font-size: 12px; color: var(--text-2); margin-bottom: 1px; }
.msg.same .msg-who { display: none; }
.msg.same .msg-side { visibility: hidden; }
.msg-text { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
.msg-text a { word-break: break-all; }
.msg.sys { justify-content: center; }
.msg.sys .msg-main { text-align: center; font-size: 11px; color: var(--text-3); }
.msg.sys .msg-side { display: none; }
.fold {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  color: var(--text-3); font-size: 11.5px; padding: 5px 8px; margin: 3px 0; border-radius: 8px;
}
.fold:hover { background: var(--panel); color: var(--text-2); }
.fold .bar { display: inline-block; width: 24px; height: 1px; background: var(--line); vertical-align: middle; margin-right: 9px; }
.msg-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--line-soft); color: var(--text-2); }
.badge.p { background: var(--accent-soft); color: var(--accent); }
.badge.f { background: var(--warn-soft); color: var(--warn); }
.badge.l { background: var(--good-soft); color: var(--good); }

/* 자료함 카드 */
.cards { padding: 14px 18px 40vh; display: flex; flex-direction: column; gap: 10px; max-width: 920px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.card-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft); font-size: 12px; color: var(--text-2);
}
.card-head .who { font-weight: 700; color: var(--text); }
.card-head .spacer { flex: 1; }
.card-body { padding: 11px 13px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.card-body.code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "D2Coding", monospace;
  font-size: 12.5px; line-height: 1.55; background: var(--panel-2);
  max-height: 340px; overflow: auto;
}
.link-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; font-size: 13px; }
.link-row .dom { font-size: 11px; font-weight: 700; color: var(--text-3); flex: none; min-width: 96px; }

/* 사진·동영상 격자 */
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.shot {
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2);
  aspect-ratio: 1; position: relative; padding: 0; display: block; cursor: zoom-in;
}
.shot img, .shot video { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .tag {
  position: absolute; left: 5px; bottom: 5px; font-size: 10px; font-weight: 700;
  background: rgba(0,0,0,.6); color: #fff; padding: 1px 5px; border-radius: 4px;
}
.shot:hover { border-color: var(--accent); }
/* 대화 안에 붙는 것은 작게 */
.shots.in-chat { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); max-width: 420px; margin-top: 6px; }
#viewer {
  position: fixed; inset: 0; background: rgba(8,10,16,.9); z-index: 80;
  display: flex; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out;
}
#viewer[hidden] { display: none; }
#viewer img, #viewer video { max-width: 100%; max-height: 100%; border-radius: 8px; }
#viewer .cap {
  position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
  color: #fff; font-size: 12px; opacity: .8;
}

/* 필터 칩 */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 99px;
  padding: 3px 11px; font-size: 12px; font-weight: 600; color: var(--text-2);
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 검색 */
.search-wrap { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.search-box {
  width: 100%; border: 1px solid var(--line); background: var(--panel-2);
  border-radius: 8px; padding: 8px 11px; font-size: 13px; color: var(--text);
}
.search-box:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.hit {
  width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line-soft);
  background: transparent; padding: 10px 14px; display: block;
}
.hit:hover { background: var(--panel-2); }
.hit-meta { font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
.hit-text {
  font-size: 12.5px; color: var(--text-2); display: -webkit-box;
  -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* 빈 화면 / 드롭존 */
.empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 40px 24px; text-align: center; color: var(--text-2); overflow-y: auto;
}
.empty h2 { margin: 0; font-size: 19px; color: var(--text); letter-spacing: -.02em; }
.empty p { margin: 0; max-width: 460px; font-size: 13px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 30px 40px; background: var(--panel); transition: .12s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.note {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 15px; font-size: 12.5px; color: var(--text-2); max-width: 560px; text-align: left;
}
.note b { color: var(--text); }
.note ol, .note ul { margin: 6px 0 0; padding-left: 18px; }
.note li { margin-bottom: 3px; }
.note code { background: var(--line-soft); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }

/* AI 요약 설정 */
#modal {
  position: fixed; inset: 0; background: rgba(16,20,30,.42); z-index: 60;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
#modal[hidden] { display: none; }
.sheet {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 12px 40px rgba(16,20,30,.22); width: 100%; max-width: 520px;
  max-height: 86vh; overflow-y: auto; padding: 20px 22px;
}
.sheet h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: -.02em; }
.sheet .lead { margin: 0 0 16px; font-size: 12.5px; color: var(--text-2); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 5px; }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); background: var(--panel-2);
  border-radius: 8px; padding: 8px 11px; font-size: 13px; color: var(--text); font-family: inherit;
}
.field input:focus, .field select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.field .help { font-size: 11.5px; color: var(--text-3); margin-top: 5px; line-height: 1.5; }
.row { display: flex; gap: 8px; align-items: center; }
.row .btn { flex: none; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.warn-box {
  background: var(--warn-soft); color: var(--warn); border-radius: 8px;
  padding: 10px 12px; font-size: 12px; line-height: 1.55; margin-bottom: 16px;
}

/* AI 정리 결과 */
.ai-block { border-left: 2px solid var(--accent); padding-left: 11px; margin-bottom: 14px; }
.ai-block .ai-tag {
  font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .04em; margin-bottom: 3px;
}
.ai-block p { margin: 0 0 7px; font-size: 12.5px; color: var(--text); line-height: 1.65; }
.ai-block .ai-sec {
  font-size: 12.5px; font-weight: 700; color: var(--text);
  margin: 10px 0 4px; letter-spacing: -.01em;
}
.ai-block .ai-sec:first-of-type { margin-top: 2px; }
.ai-block ul { margin: 0; padding-left: 16px; }
.ai-block li { font-size: 12.5px; color: var(--text-2); line-height: 1.55; margin-bottom: 3px; }
.topic.ai .topic-title::before {
  content: "AI"; font-size: 9px; font-weight: 800; color: var(--accent);
  background: var(--accent-soft); border-radius: 3px; padding: 1px 4px; margin-right: 5px; vertical-align: 1px;
}
.spin { display: inline-block; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: .18s; z-index: 70;
  max-width: min(680px, calc(100vw - 40px)); white-space: pre-line; line-height: 1.55; text-align: left;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
/* 오류는 원문까지 읽고 복사할 수 있어야 해서 오래 남기고 선택도 되게 둔다 */
#toast.long { pointer-events: auto; user-select: text; font-weight: 500; }

@media (max-width: 820px) {
  main { flex-direction: column; }
  .pane-left { width: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 44vh; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="dot"></span>단톡 정리함</div>
      <div class="rooms" id="rooms"></div>
      <button class="btn" id="aiBtn">AI 요약 설정</button>
      <button class="btn primary" id="addBtn">+ 대화 불러오기</button>
    </div>
    <div class="views" id="views">
      <button class="view-tab on" data-view="summary">요약</button>
      <button class="view-tab" data-view="vault">자료함</button>
      <button class="view-tab" data-view="month">월간</button>
      <button class="view-tab" data-view="search">검색</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<input type="file" id="fileInput" accept=".txt,.csv,.zip" multiple hidden>
<div id="toast"></div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="viewer" hidden></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   1. 카카오톡 대화 내보내기(.txt) 파서
   PC / 안드로이드 / 아이폰 세 가지 형식과 여러 줄 메시지를 모두 처리한다.
   ══════════════════════════════════════════════════════════ */

// 파서를 고치면 이 번호를 올린다. 이미 불러온 방은 저장해둔 원본으로 다시 읽는다.
const PARSER_VERSION = 2;

const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
const MONTHS_EN = ["january","february","march","april","may","june","july",
                   "august","september","october","november","december"];

// PC판 날짜 구분선:  --------------- 2026년 9월 1일 화요일 ---------------
const RE_DATE_RULE = /^-{3,}\s*(.+?)\s*-{3,}$/;
// PC판 메시지:  [홍길동] [오후 10:23] 내용
const RE_PC = /^\[([^\]]{1,60})\]\s*\[(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})\s*(AM|PM)?\]\s?(.*)$/;
// 모바일(안드로이드):  2026년 9월 1일 오후 10:23, 홍길동 : 내용
const RE_AOS = /^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일\s*(오전|오후)\s*(\d{1,2}):(\d{2}),\s*(.*)$/;
// 모바일(아이폰):  2026. 9. 1. 오후 10:23, 홍길동 : 내용
const RE_IOS = /^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.\s*(오전|오후)\s*(\d{1,2}):(\d{2}),\s*(.*)$/;
// 시스템 메시지(입장·퇴장·강퇴 등)
const RE_SYSTEM = /(님이 (들어왔습니다|나갔습니다|입장하였습니다|퇴장하였습니다)|님을 내보냈습니다|방장이 되었습니다|채팅방 이름이|운영정책을 위반)/;
// 그 중에서도 줄 하나가 통째로 입·퇴장인 경우. 오픈채팅방은 이게 하루에도 수백 줄씩
// 쌓이는데, 앞 메시지에 이어붙이면 봇 공지가 통째로 부풀어 요약을 망친다.
const RE_JOINLEAVE = /^.{0,60}(님이 (들어왔습니다|나갔습니다|입장하였습니다|퇴장하였습니다)|님을 내보냈습니다|님이 방장이 되었습니다)\.?$/;

function pad2(n) { return String(n).padStart(2, "0"); }

function to24h(ampm, h) {
  h = Number(h);
  const pm = ampm === "오후" || ampm === "PM";
  const am = ampm === "오전" || ampm === "AM";
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  return h;
}

// "2026년 9월 1일 화요일" / "September 1, 2026" 같은 날짜 구분선을 YYYY-MM-DD로
function parseDateRule(s) {
  let m = s.match(/(\d{4})[년.\-/\s]+(\d{1,2})[월.\-/\s]+(\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})/);
  if (m) {
    const mi = MONTHS_EN.indexOf(m[1].toLowerCase());
    if (mi >= 0) return `${m[3]}-${pad2(mi + 1)}-${pad2(m[2])}`;
  }
  return null;
}

// "홍길동 : 내용" 을 이름과 본문으로 가른다. 이름에 콜론이 들어간 경우를 피하려고
// 가장 먼저 나오는 " : " 를 기준으로 자른다.
function splitNameBody(rest) {
  const i = rest.indexOf(" : ");
  if (i < 0) return null;
  return { user: rest.slice(0, i).trim(), text: rest.slice(i + 3) };
}

function parseKakao(raw, fallbackName) {
  const text = raw.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const lines = text.split("\n");
  const messages = [];
  let curDate = null;
  let last = null;
  let roomName = fallbackName;

  // 첫 줄에서 방 이름을 얻는다: "OOO 님과 카카오톡 대화"
  for (let i = 0; i < Math.min(4, lines.length); i++) {
    const m = lines[i].match(/^(.*?)\s*님?과의?\s*카카오톡 대화$/) ||
              lines[i].match(/^(.*?)\s*with KakaoTalk Chats$/i);
    if (m && m[1].trim()) { roomName = m[1].trim(); break; }
  }

  const push = (user, h, mi, body, sys) => {
    const date = curDate || "0000-00-00";
    last = {
      i: messages.length, date, time: `${pad2(h)}:${pad2(mi)}`,
      ts: Date.parse(`${date}T${pad2(h)}:${pad2(mi)}:00`) || 0,
      user: user || "", text: body, sys: !!sys
    };
    messages.push(last);
  };

  for (const line of lines) {
    if (!line.trim()) { if (last) last.text += "\n"; continue; }

    const rule = line.match(RE_DATE_RULE);
    if (rule) {
      const d = parseDateRule(rule[1]);
      if (d) { curDate = d; last = null; continue; }
    }

    let m = line.match(RE_AOS) || line.match(RE_IOS);
    if (m) {
      curDate = `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
      const h = to24h(m[4], m[5]);
      const nb = splitNameBody(m[7]);
      if (nb) push(nb.user, h, Number(m[6]), nb.text, false);
      else push("", h, Number(m[6]), m[7], true);
      continue;
    }

    m = line.match(RE_PC);
    if (m) {
      const h = to24h(m[2] || m[5], m[3]);
      push(m[1], h, Number(m[4]), m[6], false);
      continue;
    }

    // 저장 안내 줄은 건너뛴다
    if (/^(저장한 날짜|Date Saved|Saved on)\s*[:：]/.test(line)) { last = null; continue; }

    // 입·퇴장 줄은 앞 메시지에 붙이지 않고 따로 떼어낸다. 다만 그 뒤에 이어지는
    // 줄은 여전히 원래 메시지의 연속이므로 last를 되돌려 놓는다.
    const bare = line.trim();
    if (RE_JOINLEAVE.test(bare)) {
      const prev = last;
      const h = prev ? Number(prev.time.slice(0, 2)) : 0;
      const mi = prev ? Number(prev.time.slice(3)) : 0;
      push("", h, mi, bare, true);
      last = prev;
      continue;
    }

    // 어느 패턴에도 안 맞는 줄: 시스템 메시지이거나 직전 메시지의 이어지는 줄
    if (RE_SYSTEM.test(line) && !last) { push("", 0, 0, bare, true); continue; }
    if (last) last.text += (last.text ? "\n" : "") + line;
    else if (RE_SYSTEM.test(line)) push("", 0, 0, bare, true);
  }

  for (const msg of messages) {
    msg.text = msg.text.replace(/\n+$/, "");
    if (!msg.sys && RE_SYSTEM.test(msg.text) && msg.text.length < 60) msg.sys = true;
  }
  return { name: roomName, messages: messages.filter(m => m.text.trim() || m.sys) };
}

/* ══════════════════════════════════════════════════════════
   2. 사담 걸러내기 · 점수 매기기 · 주제 묶기
   외부 API 없이 규칙만으로 돌아간다.
   ══════════════════════════════════════════════════════════ */

// 이 방들에서 실제로 값이 있는 이야깃거리. 요약 제목을 뽑는 데 쓴다.
const TOPICS = [
  ["AI 모델", /\b(gpt|chatgpt|claude|gemini|llama|grok|deepseek|qwen|mistral|o[34]\b)|클로드|제미나이|지피티|챗지피티|소네트|오푸스|하이쿠/i],
  ["영상 생성", /\b(sora|veo|runway|kling|pika|luma|seedance|hailuo|wan2|higgsfield)\b|소라|런웨이|클링|씨댄스|헤일루오/i],
  ["이미지 생성", /\b(midjourney|mj|stable ?diffusion|comfyui|flux|nano ?banana|ideogram|dall-?e)\b|미드저니|미드저니v|스테이블|컴피유아이|플럭스/i],
  ["자동화", /\bn8n\b|\bmake\.com\b|\bzapier\b|\brpa\b|자동화|워크플로우|워크플로|자동\s?포스팅|스케줄러|웹훅|webhook/i],
  ["크롤링·수집", /크롤링|크롤러|스크래핑|scraping|파싱|수집기|api\s?호출/i],
  ["프롬프트", /프롬프트|prompt|시스템\s?메시지|system prompt/i],
  ["개발 도구", /\b(cursor|claude ?code|copilot|windsurf|codex|replit|vscode|github)\b|커서|바이브\s?코딩|깃허브|깃헙/i],
  ["노코드·툴", /\b(notion|airtable|supabase|figma|canva|gamma|obsidian)\b|노션|에어테이블|피그마|캔바|감마|옵시디언/i],
  ["콘텐츠·수익화", /수익화|부업|외주|크몽|숨고|강의|전자책|블로그|애드센스|스마트스토어|리드\s?생성/i],
  ["유튜브·숏폼", /유튜브|youtube|쇼츠|shorts|릴스|reels|틱톡|tiktok|썸네일|조회수/i],
];

// 이름이 '봇'으로 끝나는 계정은 자동 발송으로 본다. 오픈채팅봇·비서봇·알림봇 전부.
// 이런 계정이 시키지도 않은 인사와 증시 브리핑을 하루 종일 뿌려 요약을 덮는다.
const RE_BOT_USER = /(봇|bot)$/i;

// 기수 모집·세미나 신청 같은 광고성 공지. 질의응답이 진짜 알맹이라 이런 건 내린다.
// 단어 하나로 자르면 "세미나 자료 어디 있나요?" 같은 진짜 질문까지 날아가므로
// 신호가 둘 이상이거나, 하나라도 있으면서 신청 링크가 붙어 있을 때만 광고로 본다.
const PROMO_CUES = [
  /모집/, /마감/, /선착순/, /얼리버드/, /정원\s*\d/, /참가비|수강료|입금|계좌/,
  /신청/, /무료\s*(전자책|특강|웨비나|강의|나눔|배포)/, /이벤트/, /\d\s*기\b|기수/,
  /세미나|웨비나|특강|밋업/, /공지사항/, /링크\s*(타고|에서|걸어)/,
];
function promoCues(t) { return PROMO_CUES.reduce((n, r) => n + (r.test(t) ? 1 : 0), 0); }

// 사담·리액션으로 처리해 요약에서 뺄 짧은 말들
const RE_CHATTER = new RegExp(
  "^(?:" + [
    "[ㅋㅎㅠㅜㄷㅇㄱㄴㅁㅂㅅㅈㅊㅍ~!?.,\\s]+",
    "(넵|네|넹|옙|예|응|웅|ㅇㅋ|오케이|okay|ok)[.!~\\s]*",
    "(감사합니다|감사해요|감사요|고맙습니다|고마워요|땡큐|thx|thanks)[.!~\\s]*",
    "(안녕하세요|안녕하십니까|반갑습니다|좋은\\s?아침|좋은\\s?하루|수고하셨습니다|고생하셨습니다|들어왔습니다)[.!~\\s]*",
    "(축하드립니다|축하합니다|축하해요|화이팅|파이팅|굿|good|좋아요|좋네요|멋지네요|멋져요|대박|헐|와|와우|우와|오|오오|짱)[.!~\\s]*",
    "(맞아요|맞습니다|그러네요|그렇군요|그쵸|인정|공감|동감)[.!~\\s]*",
    "(이모티콘|사진|동영상|삭제된 메시지입니다\\.?)",
  ].join("|") + ")$"
);

const RE_URL = /https?:\/\/[^\s<>"')\]]+/g;
// 줄 하나가 통째로 파일명일 때만 첨부로 본다. 이렇게 해야 본문 속 robots.txt 같은
// 말이 파일로 잘못 잡히지 않는다.
const RE_FILE = /^([^\s/\\:*?"<>|]{1,60}\.(pdf|docx?|xlsx?|pptx?|hwpx?|zip|txt|csv|json|md|py|js|ts|ipynb|png|jpe?g|gif|mp4|mov|mp3|m4a))$/i;
const RE_ATTACH = /^(파일\s*[:：]\s*(.+)|<?(사진|동영상|음성메시지|보이스톡|파일)( ?\d+장)?>?)$/;

function isChatter(t) {
  const s = t.trim();
  if (!s) return true;
  if (s.length <= 24 && RE_CHATTER.test(s)) return true;
  return false;
}

// 프롬프트로 볼 만한 신호들. 한 가지만으로는 평범한 말과 구별되지 않아 여럿을 센다.
const PROMPT_CUES = [
  // 역할을 지정하는 말
  /(당신은|너는|넌|당신의 역할|assistant)\s|you are|act as|your task|이제부터|지금부터 너/i,
  // 코드블록
  /```|~~~/,
  // '항목:' 꼴로 조건을 늘어놓는 형태 (한글)
  /^\s*[#*\-•]?\s*(역할|목표|주제|조건|규칙|제약|지시\s?사항|요구\s?사항|출력|출력\s?형식|입력|형식|예시|말투|톤|스타일|분량|단계|참고|주의|맥락|대상|목적)\s*[:：]/m,
  // 같은 형태 (영문)
  /^\s*[#*\-•]?\s*(role|task|goal|topic|context|constraints?|instructions?|examples?|input|output|format|tone|style|length|rules?|steps?|requirements?|persona|audience|objective)\s*:/im,
  // 채워 넣는 자리
  /\{\{?\s*[\w가-힣 ]{1,24}\s*\}?\}|\[[\w가-힣 ]{2,24}\]|<[\w가-힣 ]{2,24}>/,
  // 글머리표나 번호 매기기가 두 줄 이상
  /^\s*(?:#{1,4}\s|[-*•]\s|\d+[.)]\s).*\n[\s\S]*?^\s*(?:#{1,4}\s|[-*•]\s|\d+[.)]\s)/m,
  // 시키는 말투 (한글). '보세요' 같은 권유는 평범한 말이라 넣지 않는다.
  /(줘|주세요|줄래|주라|하라|해라)(?=[\s.!?~,)\]]|$)|(?:하지|쓰지|넣지|붙이지)\s?마/m,
  // 무엇을 하라는 동사 (한글)
  /(작성|생성|요약|번역|분석|추천|정리|출력|답변|변환|추출|분류|평가|검토)(해|하고|하여|해서|할)/,
  // 시키는 동사 (영문)
  /\b(generate|write|create|summari[sz]e|translate|analyz\w*|rewrite|explain|list|provide|extract|classify|respond)\b/i,
  // 조건을 다는 말 (영문)
  /\b(must|should|ensure|avoid|do not|don'?t|keep it|no more than|at least|under \d|within \d|in \w+ format)\b/i,
];

// 한국어 방에 올라온 긴 영문은 대개 어디선가 복사해 온 프롬프트다.
function mostlyLatin(s) {
  const t = s.replace(RE_URL, " ");
  const latin = (t.match(/[A-Za-z]/g) || []).length;
  const hangul = (t.match(/[가-힣]/g) || []).length;
  return latin >= 60 && latin > hangul * 3;
}

function isPromptLike(t) {
  const s = t.trim();
  const lines = s.split("\n").filter(x => x.trim()).length;
  // 짧으면 평범한 말과 구별이 안 된다. 다만 여러 줄로 짜인 글은 짧아도 프롬프트일 수 있다.
  if (s.length < 40) return false;
  if (s.length < 60 && lines < 3) return false;
  if (/^https?:\/\/\S+$/.test(s)) return false;        // 링크 한 줄은 프롬프트가 아니다

  const explicit = /(프롬프트|prompt)\s*[:：\n]/i.test(s) || /^(프롬프트|prompt)\b/i.test(s);
  let hits = PROMPT_CUES.reduce((n, r) => n + (r.test(s) ? 1 : 0), 0);
  if (explicit) hits += 3;
  if (mostlyLatin(s)) hits += 2;

  if (lines >= 4) hits += 1;
  if (lines >= 8) hits += 1;
  if (s.length > 300) hits += 1;
  if (s.length > 800) hits += 1;

  // 길거나, 여러 줄로 짜였거나, 대놓고 프롬프트라 밝힌 글은 문턱을 낮춘다
  const need = (s.length >= 300 || lines >= 3 || explicit) ? 3 : 4;
  return hits >= need;
}

// '사진' '동영상'은 무언가 오갔다는 표시일 뿐 파일 이름이 아니다.
// 자료함 '파일'은 나중에 찾아 열어볼 문서를 모으는 곳이라 이런 표시는 넣지 않는다.
const isPlaceholderFile = f => /^(사진|동영상|첨부|음성메시지|보이스톡)$/.test(f || "");

function attachmentOf(t) {
  for (const raw of t.split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    const a = line.match(RE_ATTACH);
    if (a) return a[2] ? a[2].trim() : (a[3] || "첨부");
    const f = line.match(RE_FILE);
    if (f) return f[1];
  }
  return null;
}

function topicsOf(t) {
  const out = [];
  for (const [label, re] of TOPICS) if (re.test(t)) out.push(label);
  return out;
}

// 메시지마다 점수와 표식을 붙인다. 점수가 높을수록 '정보', 낮을수록 '사담'.
// 같은 문구가 하루에도 몇 번씩 올라오면 자동 안내로 본다. 입장 인사 봇이 대표적이다.
function markRepeats(msgs) {
  const key = t => t.replace(/\s+/g, "").replace(/[‍️]/g, "").slice(0, 140);
  const seen = new Map();
  for (const m of msgs) {
    if (m.sys || m.text.length < 25) continue;
    const k = key(m.text);
    seen.set(k, (seen.get(k) || 0) + 1);
  }
  for (const m of msgs) m.repeat = !m.sys && m.text.length >= 25 && (seen.get(key(m.text)) || 0) >= 3;
}

function scoreMessages(msgs) {
  markRepeats(msgs);
  for (const m of msgs) {
    m.links = m.text.match(RE_URL) || [];
    m.file = attachmentOf(m.text);
    m.prompt = isPromptLike(m.text);
    m.topics = topicsOf(m.text);
    m.chatter = false;
    m.bot = RE_BOT_USER.test(m.user || "");
    const cues = promoCues(m.text);
    m.promo = cues >= 2 || (cues >= 1 && m.links.length > 0);

    // 봇 안내와 모집·신청 공지는 요약에서 아예 뺀다. 대화 원문과 자료함에는 그대로 남는다.
    if (m.sys || m.bot || m.promo) { m.score = -99; continue; }

    let s = Math.min(m.text.length / 120, 2.2);
    // 링크만 툭 던진 인사말("오늘도 좋은 하루 되세요 + 유튜브 링크")은 정보가 아니다.
    // 링크에 딸린 설명이 있거나 주제어를 건드릴 때만 링크값을 쳐준다.
    if (m.links.length) {
      const said = m.text.replace(RE_URL, " ").replace(/\s+/g, " ").trim();
      s += (said.length >= 25 || m.topics.length) ? 3 : 0.4;
    }
    if (m.file) s += 2;
    if (m.prompt) s += 4;
    s += Math.min(m.topics.length * 1.6, 4);
    if (/[?？]\s*$/.test(m.text) && m.text.length > 15) s += 0.8;
    if (isChatter(m.text)) { s -= 6; m.chatter = true; }
    if (m.text.length < 14 && !m.links.length && !m.file) s -= 2;
    if (m.repeat) s -= 12;   // 반복 안내
    m.score = s;
  }

  // 반응이 붙은 메시지는 그 방에서 값이 있었다는 신호로 본다
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    if (m.sys || m.score < 0) continue;
    const who = new Set();
    for (let j = i + 1; j < msgs.length && j < i + 20; j++) {
      const n = msgs[j];
      if (n.sys || n.ts - m.ts > 10 * 60 * 1000) break;
      if (n.user && n.user !== m.user) who.add(n.user);
    }
    if (who.size >= 2) m.score += 1.4;
    else if (who.size === 1) m.score += 0.5;
  }
}

const KEEP = 2.6;          // 요약에 남길 점수 문턱
const GAP_MIN = 45;        // 이 시간(분) 이상 벌어지면 일단 다른 덩어리로 끊는다
const MERGE_GAP_MIN = 60;  // 끊은 덩어리라도 같은 주제고 이만큼 안에 이어지면 도로 합친다
const MERGE_SPAN_MIN = 180; // 다만 한 덩어리가 이 시간(분)을 넘게 늘어지지는 않는다
const MERGE_MAX = 25;      // 한 덩어리에 담을 핵심 메시지 수 상한

// 봇이라고 늘 쓸모없진 않다. 사람이 물어본 직후에 나온 답이고 그 답이 이 방의
// 관심사를 건드리면 그때만 요약에 올린다. 시키지도 않은 아침 인사·증시 브리핑은 그대로 뺀다.
function reviveBotAnswers(msgs) {
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    if (!m.bot || !m.topics.length || m.repeat) continue;
    let prev = null;
    for (let j = i - 1; j >= 0; j--) {
      if (msgs[j].sys || msgs[j].bot) continue;
      prev = msgs[j];
      break;
    }
    if (!prev || m.ts - prev.ts > 5 * 60 * 1000) continue;
    if (/[?？]/.test(prev.text) || /봇/.test(prev.text)) m.score = 3.4;
  }
}

// 질문이 걸러 남았는데 정작 답변이 사담으로 밀려나는 일이 잦다.
// 남긴 메시지 뒤 10분 안에 붙는 '짧지 않고 리액션도 아닌' 말은 같은 흐름으로 끌어온다.
function expandKeep(msgs) {
  for (const m of msgs) m.keep = !m.sys && m.score >= KEEP;
  for (let i = 0; i < msgs.length; i++) {
    if (!msgs[i].keep) continue;
    for (let j = i + 1; j < msgs.length; j++) {
      const n = msgs[j];
      if (n.ts - msgs[i].ts > 10 * 60 * 1000) break;
      if (n.sys || n.keep || n.chatter || n.bot || n.repeat || n.promo) continue;
      if (n.text.trim().length >= 35) { n.keep = true; n.score += 1.6; }
    }
  }
}

function snippet(t, n) {
  // 사진 한 장이 통째로 해시 파일 이름으로 적혀 있는 줄은 그대로 보여줄 이유가 없다
  const bare = t.trim();
  if (RE_ONE_MEDIA.test(bare)) return kindOf(bare) === "video" ? "동영상" : "사진";
  const s = t.replace(RE_URL, m => {
    try { return "(" + new URL(m).hostname.replace(/^www\./, "") + " 링크)"; }
    catch (_) { return "(링크)"; }
  }).replace(/\s+/g, " ").trim();
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

// 카테고리 이름('자동화 · 유튜브')만으로는 무슨 얘기였는지 알 수 없다.
// 덩어리를 대표하는 한 문장을 실제 대화에서 뽑아 제목으로 쓴다. 질문이 있으면
// 질문이 곧 주제이므로 그것을 먼저 고른다.
// 어절 끝에 붙는 조사. 떼어내야 '자동화를'과 '자동화가'가 같은 말로 세어진다.
const RE_JOSA = /(으로서|으로써|이라고|라고|에서는|에서도|에게서|한테서|으로는|이라는|라는|에서|에게|한테|보다|처럼|까지|부터|이랑|하고|이며|으로|만큼|조차|마저|밖에|따라|와의|과의|의|을|를|이|가|은|는|에|도|만|로|와|과|랑|께|요)$/;
// 서술어로 끝나는 어절은 명사가 아니므로 제목 후보에서 뺀다.
const RE_YONGEON = /(습니다|합니다|했어요|하는데|해요|하죠|한다|하네|하는|해서|하고|하면|되요|돼요|되는|된다|있어요|있는|없어요|없는|같아요|같은|였어요|이에요|예요|거든요|네요|더라구요|더라고요|나요|까요|는데|은데|어요|아요|았어|었어|드려요|주세요|드립니다|봤어요|봅니다)$/;
const STOPWORDS = new Set([
  "그냥","진짜","정말","근데","그런데","그래서","그리고","하지만","저는","제가","우리","이거","그거","저거",
  "지금","오늘","어제","내일","이번","저번","다들","여기","저기","거기","뭔가","혹시","한번","처음","마지막",
  "얘기","이야기","사람","사람들","분들","때문","경우","정도","생각","감사","안녕","네네","진행","가능",
  "여러분","자기","자신","이런","저런","그런","무슨","어떤","이제","아직","다시","조금","많이","계속",
  // 관형형은 명사가 아니라 꾸미는 말이라 제목에 들어가면 어색하다
  "필요한","가능한","좋은","많은","다른","같은","새로운","중요한","대한","위한","어려운","쉬운",
  "빠른","느린","작은","비슷한","확실한","간단한","괜찮은","어디","언제","누가","어떻게","아주","너무","매우",
]);

// 제목은 '단어로 끝나는 한 줄'이어야 읽자마자 무슨 얘긴지 잡힌다.
// 덩어리에서 자주·여럿이 쓴 명사를 뽑아 이어 붙인다.
function keyphrase(items) {
  const count = new Map();
  const who = new Map();
  for (const m of items) {
    const boost = /[?？]/.test(m.text) ? 2 : 1;   // 질문에 나온 말이 주제어일 확률이 높다
    for (const rawWord of m.text.replace(RE_URL, " ").split(/[\s,.!?~"'()\[\]{}<>·…]+/)) {
      let w = rawWord.replace(/[^가-힣A-Za-z0-9]/g, "");
      if (RE_YONGEON.test(w)) continue;
      w = w.replace(RE_JOSA, "");
      if (w.length < 2 || w.length > 10) continue;
      if (STOPWORDS.has(w)) continue;
      if (/^\d+$/.test(w)) continue;
      count.set(w, (count.get(w) || 0) + boost);
      if (!who.has(w)) who.set(w, new Set());
      who.get(w).add(m.user);
    }
  }
  const ranked = [...count.entries()]
    .map(([w, n]) => [w, n + (who.get(w).size - 1)])   // 여러 사람이 쓴 말에 힘을 준다
    .filter(([, n]) => n >= 2)
    .sort((a, b) => b[1] - a[1]);
  if (ranked.length < 2) return null;
  return ranked.slice(0, 3).map(e => e[0]).join(" · ");
}

function sentences(t) {
  return t.replace(RE_URL, " ").split(/(?<=[.!?？。])\s+|\n+/)
    .map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);
}

function headline(items) {
  // '파일: xxx.pdf' 한 줄짜리는 제목감이 못 된다. 설명한 쪽을 고른다.
  const pool = items.filter(m => !(m.file && m.text.trim().length < 40));
  const from = pool.length ? pool : items;
  // 여러 덩어리를 합친 흐름이라면 대화를 연 질문이 곧 주제다. 그래서 가장 이른 질문을 고른다.
  const asked = from.filter(m => /[?？]/.test(m.text) && m.text.trim().length > 15);
  const seed = asked.length
    ? [...asked].sort((a, b) => a.i - b.i)[0]
    : [...from].sort((a, b) => b.score - a.score)[0];

  const ss = sentences(seed.text);
  let t = ss.find(s => /[?？]/.test(s) && s.length >= 12)   // 질문이 곧 주제다
       || ss.find(s => s.length >= 12)
       || ss[0] || seed.text;
  t = t.replace(/^[^가-힣A-Za-z0-9"'(]+/, "")              // 앞머리 이모지·기호·글머리표
       .replace(/[ㅋㅎㅠㅜ~^;,.\s]+$/, "").trim();
  if (t.length < 6) t = seed.text.replace(/\s+/g, " ").trim();
  return t.length > 36 ? t.slice(0, 35) + "…" : (t || "대화");
}

// 하루치를 '주제 덩어리'로 나눈다. 시간이 벌어지거나 덩어리가 커지면 끊는다.
// 덩어리 번호(첫째, 둘째…)를 이름표로 쓰면, 대화를 다시 불러와 묶임이 조금만 달라져도
// 번호가 밀려 예전에 만든 AI 정리가 엉뚱한 덩어리에 붙는다. 첫 메시지의 내용으로 이름을 짓는다.
function shortHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
const topicId = m => `${m.date}#${m.time}#${shortHash(m.text.slice(0, 80))}`;

const labelsOf = items => {
  const s = new Set();
  for (const m of items) for (const t of m.topics) s.add(t);
  return s;
};

function buildTopics(dayMsgs, all) {
  const kept = dayMsgs.filter(m => m.keep);
  let groups = [];
  let cur = null;
  for (const m of kept) {
    if (!cur || m.ts - cur.lastTs > GAP_MIN * 60 * 1000 || cur.items.length >= MERGE_MAX) {
      cur = { items: [], lastTs: m.ts };
      groups.push(cur);
    }
    cur.items.push(m);
    cur.lastTs = m.ts;
  }

  // 한 흐름으로 이어진 대화가 시간만 벌어졌다고 여러 덩어리로 쪼개지면
  // 같은 얘기를 두 번 읽어야 한다. 주제가 겹치고 가까이 붙어 있으면 도로 합친다.
  const merged = [];
  for (const g of groups) {
    const prev = merged[merged.length - 1];
    if (prev) {
      const gap = g.items[0].ts - prev.lastTs;
      const span = g.lastTs - prev.items[0].ts;
      const shared = [...labelsOf(g.items)].some(l => labelsOf(prev.items).has(l));
      if (shared && gap <= MERGE_GAP_MIN * 60 * 1000 &&
          span <= MERGE_SPAN_MIN * 60 * 1000 &&
          prev.items.length + g.items.length <= MERGE_MAX) {
        prev.items.push(...g.items);
        prev.lastTs = g.lastTs;
        continue;
      }
    }
    merged.push(g);
  }
  groups = merged;

  return groups.map(g => {
    const items = g.items;
    const counts = new Map();
    for (const m of items) for (const t of m.topics) counts.set(t, (counts.get(t) || 0) + 1);
    const labels = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]);

    // 명사구가 안 잡히는 짧은 덩어리는 원문 한 문장으로 대신한다.
    const title = keyphrase(items) || headline(items);

    const bullets = [...items].sort((a, b) => b.score - a.score).slice(0, 4)
      .sort((a, b) => a.i - b.i).map(m => snippet(m.text, 74));

    const users = new Set(items.map(m => m.user).filter(Boolean));
    // 요약에 남은 메시지 앞뒤로 대화가 이어지므로 맥락까지 함께 짚어준다
    const from = items[0].i, to = items[items.length - 1].i;
    const raw = all.filter(m => m.i >= from && m.i <= to && !m.sys).length;

    return {
      id: topicId(items[0]),
      title, bullets, labels,
      time: `${items[0].time}~${items[items.length - 1].time}`,
      users: users.size, raw,
      marks: items.map(m => m.i),
      anchor: items[0].i,
      hasPrompt: items.some(m => m.prompt),
      hasFile: items.some(m => m.file),
      hasLink: items.some(m => m.links.length),
    };
  });
}

function analyze(room) {
  const msgs = room.messages;
  scoreMessages(msgs);
  reviveBotAnswers(msgs);
  expandKeep(msgs);
  const byDate = new Map();
  for (const m of msgs) {
    if (!byDate.has(m.date)) byDate.set(m.date, []);
    byDate.get(m.date).push(m);
  }
  const days = [...byDate.entries()]
    .sort((a, b) => (a[0] < b[0] ? 1 : -1))   // 최근 날짜가 위로
    .map(([date, list]) => {
      const real = list.filter(m => !m.sys);
      return {
        date, msgs: list,
        total: real.length,
        topics: buildTopics(real, msgs),
        prompts: real.filter(m => m.prompt),
        files: real.filter(m => m.file && !m.prompt && !isPlaceholderFile(m.file)),
        links: real.filter(m => m.links.length),
      };
    });
  room.days = days;
  room.users = new Set(msgs.map(m => m.user).filter(Boolean)).size;
  return room;
}

/* ══════════════════════════════════════════════════════════
   3. 저장 (IndexedDB — 대화 파일이 커도 견딘다)
   ══════════════════════════════════════════════════════════ */

const DB_NAME = "dantok-organizer", STORE = "rooms", SUMS = "summaries", MEDIA = "media";
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 3);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "id" });
      if (!d.objectStoreNames.contains(SUMS)) d.createObjectStore(SUMS, { keyPath: "id" });
      if (!d.objectStoreNames.contains(MEDIA)) {
        d.createObjectStore(MEDIA, { keyPath: "id" }).createIndex("room", "roomId");
      }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}

// AI 요약 결과. id는 "방id|2026-08-06" 또는 월 요약이면 "방id|2026-08"
async function sumGetAll() {
  try {
    const d = await db();
    return await new Promise((res, rej) => {
      const q = d.transaction(SUMS).objectStore(SUMS).getAll();
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => rej(q.error);
    });
  } catch (_) { return []; }
}
async function sumPut(rec) {
  try {
    const d = await db();
    d.transaction(SUMS, "readwrite").objectStore(SUMS).put(rec);
  } catch (_) {}
}
async function dbAll() {
  try {
    const d = await db();
    return await new Promise((res, rej) => {
      const q = d.transaction(STORE).objectStore(STORE).getAll();
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => rej(q.error);
    });
  } catch (_) { return []; }
}
async function dbPut(room) {
  try {
    const d = await db();
    const rec = {
      id: room.id, name: room.name, pv: PARSER_VERSION, raws: room.raws || [],
      newFrom: room.newFrom || null, mediaDiag: room.mediaDiag || null,
      messages: room.messages.map(m => ({
        i: m.i, date: m.date, time: m.time, ts: m.ts, user: m.user, text: m.text, sys: m.sys
      }))
    };
    d.transaction(STORE, "readwrite").objectStore(STORE).put(rec);
  } catch (_) { toast("저장에 실패했어요. 브라우저 저장 공간을 확인해 주세요."); }
}
// 사진·동영상. 용량이 커서 대화와 따로 둔다.
async function mediaPut(rec) {
  try {
    const d = await db();
    await new Promise((res, rej) => {
      const t = d.transaction(MEDIA, "readwrite");
      t.objectStore(MEDIA).put(rec);
      t.oncomplete = res;
      t.onerror = () => rej(t.error);
    });
    return true;
  } catch (_) { return false; }
}
async function mediaOf(roomId) {
  try {
    const d = await db();
    return await new Promise((res, rej) => {
      const q = d.transaction(MEDIA).objectStore(MEDIA).index("room").getAll(roomId);
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => rej(q.error);
    });
  } catch (_) { return []; }
}
async function mediaDel(roomId) {
  try {
    const d = await db();
    const t = d.transaction(MEDIA, "readwrite");
    const idx = t.objectStore(MEDIA).index("room");
    const q = idx.openKeyCursor(IDBKeyRange.only(roomId));
    q.onsuccess = () => {
      const c = q.result;
      if (!c) return;
      t.objectStore(MEDIA).delete(c.primaryKey);
      c.continue();
    };
  } catch (_) {}
}

async function dbDel(id) {
  try { (await db()).transaction(STORE, "readwrite").objectStore(STORE).delete(id); } catch (_) {}
}

/* ══════════════════════════════════════════════════════════
   3.5 AI 요약 (선택 기능)
   키는 이 브라우저에만 저장된다. 코드에도, 저장소에도 들어가지 않는다.
   여기서만 대화가 바깥으로 나가므로, 보내는 것은 걸러 남긴 알맹이뿐이다.
   ══════════════════════════════════════════════════════════ */

const AI_STORE = "dantok-ai";
const AI = { provider: "claude", key: "", model: "claude-opus-5" };
const AI_DEFAULT_MODEL = { claude: "claude-opus-5", gemini: "gemini-2.5-flash" };

function loadAI() {
  try { Object.assign(AI, JSON.parse(localStorage.getItem(AI_STORE) || "{}")); } catch (_) {}
}
function saveAI() {
  try { localStorage.setItem(AI_STORE, JSON.stringify(AI)); } catch (_) {}
}
const aiReady = () => !!(AI.key || "").trim();

// 제미나이 키는 AIza로, 클로드 키는 sk-ant- 로 시작한다.
// 제공사를 잘못 고른 채 키를 넣는 실수가 잦아서 모양만 봐도 짚어줄 수 있다.
function keyShapeWarning(provider, key) {
  const k = (key || "").trim();
  if (!k) return "";
  if (provider === "gemini" && !k.startsWith("AIza"))
    return "제미나이 키는 보통 AIza로 시작해요. 다른 곳에서 받은 키가 아닌지 확인해 주세요.";
  if (provider === "claude" && !k.startsWith("sk-ant-"))
    return "클로드 키는 sk-ant- 로 시작해요. 다른 곳에서 받은 키가 아닌지 확인해 주세요.";
  return "";
}

// 친절한 안내로 서버 원문을 덮어버리면 정작 원인을 못 찾는다. 안내와 원문을 함께 남긴다.
function apiError(data, status) {
  const msg = (data && (data.error?.message || data.message)) || "";
  const shape = keyShapeWarning(AI.provider, AI.key);
  let kind = "other", head;

  // 구글은 키가 틀려도 401이 아니라 400으로 답한다. 문구를 같이 봐야 원인이 잡힌다.
  if (/api[ _]?key not valid|invalid api key|api key expired/i.test(msg) || status === 401 || status === 403) {
    kind = "key";
    head = (shape ? shape + " " : "") +
      "키가 거절됐어요. ①제공사 선택 ②키가 살아있는지 ③통째로 붙여넣었는지 확인해 주세요.";
  } else if (status === 429 || status === 503 || status === 529 || status === 500 || status === 502 ||
             /high demand|overloaded|try again later/i.test(msg)) {
    // 모델이 붐비는 것은 내 요청이 잘못돼서가 아니다. 기다렸다 다시 보내면 된다.
    kind = "busy";
    head = "그 모델에 지금 사람이 몰렸어요. 잠시 뒤 다시 시도하거나 설정에서 다른 모델을 골라 보세요.";
  } else if (status === 404 || /is not found|not supported for generateContent|unknown name|unsupported/i.test(msg)) {
    kind = "model";
    head = `'${AI.model}' 모델로는 이 요청을 처리할 수 없어요.`;
  } else {
    head = `요약에 실패했어요 (${status}).`;
  }
  const err = new Error(msg ? `${head}\n서버가 보낸 말: ${msg.slice(0, 300)}` : head);
  err.kind = kind;
  return err;
}

async function claudeFetch(body) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": AI.key.trim(),
      "anthropic-version": "2023-06-01",
      // 브라우저에서 직접 부르려면 이 헤더가 필요하다
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  return { ok: res.ok, status: res.status, data: await res.json().catch(() => null) };
}

async function askClaude(system, user) {
  const base = {
    model: AI.model || AI_DEFAULT_MODEL.claude,
    max_tokens: 8000,
    system,
    messages: [{ role: "user", content: user }],
  };
  // 요약은 깊이 생각할 일이 아니라서 낮은 단계로 둔다. 값도 그만큼 덜 나간다.
  // 다만 값싼 옛 모델은 이 항목 자체를 안 받으므로, 거절당하면 빼고 다시 보낸다.
  let r = await claudeFetch({ ...base, output_config: { effort: "low" } });
  if (!r.ok && r.status === 400 && /output_config|effort/i.test(r.data?.error?.message || "")) {
    r = await claudeFetch(base);
  }
  if (!r.ok) throw apiError(r.data, r.status);
  if (r.data.stop_reason === "refusal") throw new Error("모델이 이 내용의 요약을 거절했어요.");
  return (r.data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
}

async function geminiFetch(version, model, body) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/${version}/models/${encodeURIComponent(model)}:generateContent`, {
    method: "POST",
    // 키를 주소에 붙이면 기록에 남는다. 헤더로 보낸다.
    headers: { "content-type": "application/json", "x-goog-api-key": AI.key.trim() },
    body: JSON.stringify(body),
  });
  return { ok: res.ok, status: res.status, data: await res.json().catch(() => null) };
}

async function askGemini(system, user) {
  const model = AI.model || AI_DEFAULT_MODEL.gemini;
  // 모델마다 받아주는 판(v1/v1beta)과 옵션이 다르다. 거절당하면 옵션을 덜어내고 다시 시도한다.
  const rich = {
    systemInstruction: { parts: [{ text: system }] },
    contents: [{ role: "user", parts: [{ text: user }] }],
    generationConfig: { responseMimeType: "application/json", temperature: 0.2 },
  };
  const plain = {
    contents: [{ role: "user", parts: [{ text: `${system}\n\n---\n\n${user}` }] }],
    generationConfig: { temperature: 0.2 },
  };
  const tries = [["v1beta", rich], ["v1beta", plain], ["v1", plain]];

  let last = null;
  for (const [version, body] of tries) {
    const r = await geminiFetch(version, model, body);
    if (r.ok) {
      const c = r.data.candidates?.[0];
      const text = (c?.content?.parts || []).map(p => p.text || "").join("");
      if (text) return text;
      const why = c?.finishReason || r.data.promptFeedback?.blockReason || "알 수 없음";
      throw new Error(`모델이 답을 돌려주지 않았어요 (${why}). 다른 날짜로 시도하거나 모델을 바꿔 보세요.`);
    }
    last = r;
    // 키나 한도 문제라면 옵션을 바꿔도 소용없다
    if (r.status !== 400 && r.status !== 404) break;
  }
  throw apiError(last.data, last.status);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// 두 가지는 사용자가 손댈 일이 아니다.
// 고른 모델이 이 계정에서 안 통하면 쓸 수 있는 다른 것으로 바꿔 보고,
// 모델이 붐벼서 밀린 것이면 시간을 벌려가며 다시 보낸다. 붐벼서 실패한 요청은 값도 안 나간다.
async function askAI(system, user, onWait) {
  const call = () => (AI.provider === "gemini" ? askGemini : askClaude)(system, user);
  const waits = [4000, 10000, 25000];
  let swapped = false, waited = 0;

  for (;;) {
    try {
      return await call();
    } catch (err) {
      // 붐비는 건 기다리면 풀린다. 먼저 시간을 벌어 본다.
      if (err.kind === "busy" && waited < waits.length) {
        const ms = waits[waited++];
        if (onWait) onWait(`서버가 붐벼요. ${ms / 1000}초 뒤 다시 시도 (${waited}/${waits.length})`);
        await sleep(ms);
        continue;
      }
      // 기다려도 안 풀리거나 이 모델 자체가 안 되면, 쓸 수 있는 다른 모델로 옮겨 탄다.
      if ((err.kind === "model" || err.kind === "busy") && !swapped) {
        const list = await listModels().catch(() => []);
        const next = list.find(id => id !== AI.model);
        if (!next) throw err;
        AI.model = next;
        saveAI();
        swapped = true;
        waited = 0;
        if (onWait) onWait(`'${next}' 모델로 바꿔서 다시 해볼게요`);
        continue;
      }
      throw err;
    }
  }
}

// 구글이 주는 목록에는 글쓰기와 무관한 모델과 이미 물러난 옛 모델이 섞여 있고
// 순서도 쓸모 순이 아니다. 그대로 첫 줄을 고르면 404가 난다. 걸러서 줄 세운다.
const GEMINI_SKIP = /embedding|aqa|imagen|veo|-tts|image-generation|native-audio|live-|vision/i;
function rankGemini(id) {
  let s = /^gemini-/.test(id) ? 100 : 0;
  s += (parseFloat((id.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1]) || 0) * 10;
  if (/flash/.test(id)) s += 8;            // 요약에는 값싸고 빠른 쪽이 맞다
  if (/pro/.test(id)) s += 5;
  if (/lite/.test(id)) s -= 1;           // 무료 등급에선 값 차이가 없으니 품질 쪽을 앞에 둔다
  if (/latest/.test(id)) s += 2;
  if (/preview|exp\b|-exp-|thinking/.test(id)) s -= 6;
  return s;
}

async function listModels() {
  if (AI.provider === "gemini") {
    const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",
      { headers: { "x-goog-api-key": AI.key.trim() } });
    const d = await res.json().catch(() => null);
    if (!res.ok) throw apiError(d, res.status);
    const all = (d.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map(m => m.name.replace(/^models\//, ""))
      .filter(id => !GEMINI_SKIP.test(id));
    const ranked = all.sort((a, b) => rankGemini(b) - rankGemini(a));
    if (!ranked.length) throw new Error("글을 쓸 수 있는 모델이 목록에 없어요. 다른 키로 시도해 주세요.");
    return ranked;
  }
  const res = await fetch("https://api.anthropic.com/v1/models?limit=100", {
    headers: {
      "x-api-key": AI.key.trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
  });
  const d = await res.json().catch(() => null);
  if (!res.ok) throw apiError(d, res.status);
  return (d.data || []).map(m => m.id);
}

const SYS_DAY = `너는 오픈채팅방 대화를 정리하는 편집자다.
이 방은 AI와 자동화로 수익을 내려는 사람들이 모인 곳이다. 읽는 사람은 자동화에 필요한
시스템·도구·재료·방법을 배우려고 이 방을 본다.

지켜야 할 것:
- 인사, 사담, 리액션, 기수 모집이나 세미나 신청 같은 광고는 정리하지 않는다.
- 대화에 없는 사실은 절대 지어내지 않는다. 확실하지 않으면 아예 쓰지 않는다.
- 도구 이름, 모델 이름, 수치, 설정값처럼 나중에 찾아 쓸 수 있는 정보를 가장 앞에 둔다.
- 질문과 답이 오갔다면 무엇을 물었고 결론이 무엇이었는지를 분명히 쓴다.
- 짧고 담백한 문어체로 쓴다. 존댓말과 군더더기를 뺀다.
- 반드시 JSON만 출력한다. 코드블록 표시나 앞뒤 설명을 붙이지 않는다.

줄글로 늘어놓지 말고 대항목과 소항목으로 나눈다. 나중에 그대로 옮겨 적어 공부할 수 있어야 한다.
- 대항목(heading)은 2~5개. 명사로 끝나는 15자 이내로 쓴다.
- 소항목(points)은 대항목마다 2~5개. 한 줄에 하나씩, 도구 이름과 구체적인 방법을 담는다.

출력 형식:
{"day":{"sections":[{"heading":"대항목","points":["소항목","소항목"]}]},
 "topics":[{"n":1,"title":"명사로 끝나는 20자 이내 제목","summary":"2~4문장 정리","points":["나중에 찾아 쓸 정보"]}]}`;

const SYS_MONTH = `너는 오픈채팅방 대화 정리를 한 달 단위로 묶는 편집자다.
아래는 날짜별 정리다. 이것을 한 달 흐름으로 다시 정리한다.

지켜야 할 것:
- 주어진 정리에 없는 사실은 지어내지 않는다.
- 여러 날에 걸쳐 반복해서 나온 주제를 앞에 둔다.
- 도구 이름과 구체적인 방법을 살린다.
- 짧고 담백한 문어체로 쓴다.
- 반드시 JSON만 출력한다.

출력 형식:
{"month":{"sections":[{"heading":"대항목","points":["소항목","소항목"]}]},
 "themes":[{"title":"명사로 끝나는 20자 이내 제목","summary":"2~4문장","days":["2026-08-06"]}]}`;

// 모델이 앞뒤에 말을 붙이는 경우가 있어 중괄호 범위를 다시 잘라 본다.
function parseJSON(text) {
  const t = (text || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  try { return JSON.parse(t); } catch (_) {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (_) {} }
  throw new Error("요약 결과를 읽지 못했어요. 다시 시도해 주세요.");
}

// 보내는 양이 곧 요금이다. 전체가 아니라 걸러 남긴 알맹이만, 그것도 길이를 잘라 보낸다.
function dayPayload(d) {
  const out = [`[날짜] ${d.date}`, `[전체 ${d.total}건 가운데 아래가 걸러 남은 대화다]`, ""];
  d.topics.forEach((t, i) => {
    out.push(`## 덩어리 ${i + 1} (${t.time})`);
    for (const m of d.msgs.filter(m => t.marks.includes(m.i))) {
      out.push(`${m.user}: ${m.text.replace(/\s+/g, " ").slice(0, 500)}`);
    }
    out.push("");
  });
  return out.join("\n");
}

async function summarizeDay(r, d) {
  const raw = await askAI(SYS_DAY, dayPayload(d), busyNote);
  const j = parseJSON(raw);
  const topics = {};
  for (const t of j.topics || []) {
    const key = d.topics[(Number(t.n) || 0) - 1]?.id;
    if (key) topics[key] = { title: t.title || "", summary: t.summary || "", points: t.points || [] };
  }
  // 정리했을 때 그 날 대화가 몇 건이었는지 남긴다. 나중에 다시 내보내 넣으면
  // 그 날이 더 길어졌을 수 있는데, 이 숫자가 있어야 '늘어났다'를 알아챌 수 있다.
  const rec = { id: `${r.id}|${d.date}`, kind: "day", day: j.day || "", topics, total: d.total, at: Date.now() };
  await sumPut(rec);
  S.sums[rec.id] = rec;
  return rec;
}

async function summarizeMonth(r, month, days) {
  const parts = [`[달] ${month}`, ""];
  for (const d of days) {
    const s = S.sums[`${r.id}|${d.date}`];
    if (!s) continue;
    parts.push(`## ${d.date}`, s.day);
    for (const t of d.topics) {
      const ai = s.topics[t.id];
      if (ai) parts.push(`- ${ai.title}: ${ai.summary}`);
    }
    parts.push("");
  }
  const raw = await askAI(SYS_MONTH, parts.join("\n"), busyNote);
  const j = parseJSON(raw);
  const rec = { id: `${r.id}|${month}`, kind: "month", month: j.month || "", themes: j.themes || [], at: Date.now() };
  await sumPut(rec);
  S.sums[rec.id] = rec;
  return rec;
}

// 하루씩 눌러 40일을 채우는 건 사람이 할 일이 아니다. 안 된 날만 골라 이어서 돌린다.
// 도중에 멈출 수 있어야 하고, 이미 끝낸 날은 저장돼 있으니 다시 눌러도 낭비가 없다.
async function summarizeDays(r, todo, onNote) {
  let done = 0;
  for (const d of todo) {
    if (S.stop) break;
    onNote(`${done + 1}/${todo.length}일째 — ${fmtDate(d.date)}`);
    await summarizeDay(r, d);
    done++;
  }
  return { done, total: todo.length };
}

const aiDay = (r, date) => S.sums[`${r ? r.id : ""}|${date}`];

// 정리한 뒤에 그 날 대화가 더 늘었는지. 마지막 날은 내보낸 시각 이후가 잘려 있어서 흔한 일이다.
function aiStale(r, d) {
  const s = aiDay(r, d.date);
  return !!(s && typeof s.total === "number" && d.total > s.total);
}
const aiTopic = (r, date, id) => (aiDay(r, date)?.topics || {})[id];

let toastTimer = null;

  const t = $("#toast");
