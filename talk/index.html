        <select id="aiModel" style="flex:1"></select>
        <button class="btn" id="aiLoad">키 확인 · 모델 불러오기</button>
      </div>
      <div class="help" id="modelHelp"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="aiClear">키 지우기</button>
      <button class="btn" id="aiCancel">닫기</button>
      <button class="btn primary" id="aiSave">저장</button>
    </div>`;

  const prov = sheet.querySelector("#aiProvider");
  const keyIn = sheet.querySelector("#aiKey");
  const modelSel = sheet.querySelector("#aiModel");
  const help = sheet.querySelector("#keyHelp");
  const shape = sheet.querySelector("#keyShape");

  // 붙여넣는 즉시 모양이 맞는지 알려준다. 저장하고 요약을 눌러야 알게 되면 늦다.
  const syncShape = () => {
    const w = keyShapeWarning(prov.value, keyIn.value);
    shape.textContent = w;
    shape.style.color = w ? "var(--warn)" : "";
  };

  const fillModels = list => {
    modelSel.innerHTML = "";
    const fromApi = !!(list && list.length);
    const items = fromApi ? list : [AI.model || AI_DEFAULT_MODEL[prov.value]];
    items.forEach((id, i) => {
      // 목록은 쓸모 순으로 줄 세워 두었다. 맨 위가 이 용도에 가장 무난한 모델이다.
      const o = el("option", null, esc(id) + (fromApi && i === 0 ? " — 추천" : ""));
      o.value = id;
      modelSel.appendChild(o);
    });
    // 저장해둔 모델이 목록에 없으면 맨 위(추천)가 그대로 선택된 채로 남는다
    if (AI.model && items.includes(AI.model)) modelSel.value = AI.model;
  };
  const mHelp = sheet.querySelector("#modelHelp");
  const syncHelp = () => {
    help.innerHTML = prov.value === "gemini"
      ? `Google AI Studio(aistudio.google.com)의 <b>Get API key</b>에서 발급해요.`
      : `Anthropic 콘솔(console.anthropic.com)의 <b>Settings → API keys</b>에서 발급해요.
         용도별로 여러 개 만들어 두면 하나만 따로 폐기할 수 있어요.`;
    // 모델에 따라 값이 몇 배씩 차이 난다. 고르기 전에 알고 골라야 한다.
    mHelp.innerHTML = prov.value === "claude"
      ? `키를 넣으면 쓸 수 있는 모델이 채워져요. <b>값 차이가 큽니다</b> — 100만 토큰당 대략
         <b>Haiku</b> 입력 $1 · 출력 $5, <b>Sonnet</b> $2 · $10, <b>Opus</b> $5 · $25.
         요약은 가벼운 작업이라 <b>Haiku로도 충분</b>해요. 정확한 값은 콘솔 가격표에서 확인하세요.`
      : `키를 넣으면 쓸 수 있는 모델이 채워져요. 요약은 가벼운 작업이라 값싼 모델로도 충분해요.`;
  };

  prov.value = AI.provider;
  keyIn.value = AI.key;
  syncHelp();
  syncShape();
  fillModels(null);

  // 목록을 안 불러온 상태에서는 저장된 모델 하나만 보여 '고를 게 없는' 화면이 된다.
  // 키가 이미 있으면 열자마자 조용히 불러와 채운다.
  const autoLoad = async () => {
    if (!aiReady()) return;
    modelSel.disabled = true;
    const keep = modelSel.innerHTML;
    modelSel.innerHTML = "<option>불러오는 중…</option>";
    try {
      AI.provider = prov.value;
      fillModels(await listModels());
    } catch (_) {
      modelSel.innerHTML = keep;   // 실패하면 쓰던 것을 그대로 둔다. 버튼으로 다시 시도할 수 있다.
    } finally {
      modelSel.disabled = false;
    }
  };
  autoLoad();

  keyIn.oninput = syncShape;
  prov.onchange = () => {
    AI.model = AI_DEFAULT_MODEL[prov.value];
    syncHelp();
    syncShape();
    fillModels(null);
    autoLoad();
  };
  // 이 버튼이 키 확인을 겸한다. 성공하면 키가 살아있다는 뜻이다.
  sheet.querySelector("#aiLoad").onclick = async e => {
    const b = e.currentTarget;
    AI.provider = prov.value;
    AI.key = keyIn.value;
    b.disabled = true;
    b.textContent = "확인 중…";
    try {
      const list = await listModels();
      fillModels(list);
      toast(`키 확인됨 — 쓸 수 있는 모델 ${list.length}개를 불러왔어요`);
    } catch (err) {
      toast(err.message);
    } finally {
      b.disabled = false;
      b.textContent = "키 확인 · 모델 불러오기";
    }
  };
  sheet.querySelector("#aiClear").onclick = () => {
    AI.key = "";
    saveAI();
    keyIn.value = "";
    toast("키를 지웠어요");
  };
  sheet.querySelector("#aiCancel").onclick = closeModal;
  sheet.querySelector("#aiSave").onclick = () => {
    AI.provider = prov.value;
    AI.key = keyIn.value.trim();
    AI.model = modelSel.value || AI_DEFAULT_MODEL[prov.value];
    saveAI();
    closeModal();
    render();
    toast(aiReady() ? "저장했어요. 날짜를 고르고 'AI로 정리'를 눌러보세요." : "키 없이 저장했어요");
  };
}

// 기다리는 동안 무슨 일이 벌어지는지 버튼에 그대로 적는다. 말없이 멈춰 있으면 고장으로 보인다.
function busyNote(msg) {
  S.busyNote = msg;
  render();
}

// 요약을 돌리는 동안 버튼을 잠그고, 끝나면 화면을 다시 그린다.
async function runSummary(label, fn) {
  if (!aiReady()) { openAISettings(); return; }
  if (S.busy) return;
  S.busy = label;
  S.busyNote = null;
  S.stop = false;
  render();
  try {
    await fn();
    toast("정리했어요");
  } catch (err) {
    toast(err.message || "요약에 실패했어요");
  } finally {
    S.busy = null;
    S.busyNote = null;
    S.stop = false;
    render();
  }
}

/* ── 방마다 보던 자리 기억하기 ──
   방을 옮겼다가 돌아오면 처음 화면으로 돌아가 있으면, 보던 날짜와 요약을 다시 찾아야 한다.
   방마다 마지막 자리를 따로 적어 두고 돌아올 때 그대로 되돌린다. */

const VIEW_STORE = "dantok-view";
let viewSaveTimer = null;

// 탭마다 보던 것이 다르다. 요약은 날짜와 고른 요약, 자료함은 날짜와 갈래, 월간은 달,
// 검색은 검색어다. 한 덩어리로 묶어두면 탭을 옮길 때마다 서로를 덮어써서 자리를 잃는다.
function keepRoomState() {
  if (!S.roomId) return;
  const st = S.roomState[S.roomId] || (S.roomState[S.roomId] = {});
  st.view = S.view;
  if (S.view === "summary") st.summary = { date: S.date, topicId: S.topicId };
  else if (S.view === "vault") st.vault = { date: S.date, kind: S.vaultKind };
  else if (S.view === "month") st.month = S.month;
  else st.search = S.query;

  S.lastRoom = S.roomId;
  // 화면을 그릴 때마다 저장하면 낭비라 잠시 모았다가 한 번에 적는다
  clearTimeout(viewSaveTimer);
  viewSaveTimer = setTimeout(() => {
    try {
      localStorage.setItem(VIEW_STORE, JSON.stringify({ rooms: S.roomState, last: S.lastRoom }));
    } catch (_) {}
  }, 400);
}

// 그 사이 대화를 다시 넣어 날짜나 요약 덩어리가 달라졌을 수 있다. 없는 것은 붙들지 않는다.
function pruneState() {
  const r = room();
  if (!r) return;
  if (S.date && !r.days.some(d => d.date === S.date)) { S.date = null; S.topicId = null; }
  if (S.topicId) {
    const d = r.days.find(x => x.date === S.date);
    if (!d || !d.topics.some(t => t.id === S.topicId)) S.topicId = null;
  }
  if (S.month && !monthsOf(r).some(([m]) => m === S.month)) S.month = null;
  // 요약은 날짜가 있어야 볼 것이 있다. 처음 열면 가장 최근 날로 시작한다.
  if (S.view === "summary" && !S.date && r.days.length) S.date = r.days[0].date;
}

function applyView(view) {
  const st = S.roomState[S.roomId] || {};
  S.view = view;
  if (view === "summary") {
    S.date = (st.summary || {}).date || null;
    S.topicId = (st.summary || {}).topicId || null;
  } else if (view === "vault") {
    S.date = (st.vault || {}).date || null;       // 비어 있으면 '전체 기간'
    S.vaultKind = (st.vault || {}).kind || "all";
  } else if (view === "month") {
    S.month = st.month || null;
  } else {
    S.query = st.search || "";
  }
  pruneState();
}

// 탭을 옮길 때는 떠나는 탭의 자리를 먼저 적어 둔다.
function goView(view) {
  keepRoomState();
  applyView(view);
}

// 방을 옮길 때도 마찬가지다. 적어 두는 것이 먼저이고, 그다음에 방을 바꾼다.
function goRoom(id) {
  keepRoomState();
  S.roomId = id;
  applyView((S.roomState[id] || {}).view || "summary");
}

/* ── 방 탭 ── */
function renderRooms() {
  const box = $("#rooms");
  box.innerHTML = "";
  for (const r of S.rooms) {
    const b = el("button", "room-tab" + (r.id === S.roomId ? " on" : ""));
    b.innerHTML = `<span>${esc(r.name)}</span><span class="cnt">${r.messages.length.toLocaleString()}</span><span class="x" title="이 방 지우기">×</span>`;
    b.onclick = e => {
      if (e.target.classList.contains("x")) {
        if (!confirm(`'${r.name}' 을(를) 목록에서 지울까요? (원본 파일은 그대로예요)`)) return;
        dbDel(r.id);
        mediaDel(r.id);
        S.rooms = S.rooms.filter(x => x.id !== r.id);
        delete S.roomState[r.id];
        if (S.roomId === r.id) {
          if (S.rooms[0]) goRoom(S.rooms[0].id);
          else { S.roomId = null; S.date = null; S.topicId = null; }
        }
        render();
        return;
      }
      if (r.id !== S.roomId) goRoom(r.id);
      render();
    };
    box.appendChild(b);
  }
}

/* ── 요약 뷰 ── */
function renderSummary(main) {
  const r = room();
  const left = el("div", "pane-left");
  const lh = el("div", "pane-head");
  lh.innerHTML = `<span>날짜별 요약</span><span class="spacer"></span>
    <span style="font-weight:500;color:var(--text-3)">${r.days.length}일 · 참여 ${r.users}명</span>`;
  left.appendChild(lh);

  const list = el("div", "scroll");
  list.id = "leftScroll";

  // 다시 내보내 넣었을 때 어디부터가 새 대화인지 여기서 짚어준다.
  // 목록이 최근 날짜부터라서 새로 들어온 날은 위쪽에 모인다.
  const newCount = r.newFrom ? r.days.filter(d => d.date >= r.newFrom).length : 0;
  let ruleDrawn = false;

  for (const d of r.days) {
    if (newCount && !ruleDrawn && d.date < r.newFrom) {
      const rule = el("button", "new-rule");
      rule.innerHTML = `<span>↑ 여기까지 새로 들어온 ${newCount}일</span><span class="x">표시 지우기</span>`;
      rule.onclick = () => { r.newFrom = null; dbPut(r); render(); };
      list.appendChild(rule);
      ruleDrawn = true;
    }
    const box = el("div", "day" + (d.date === S.date ? " on open" : ""));
    box.dataset.day = d.date;
    const head = el("button", "day-head");
    const marks = [d.topics.some(t => t.hasPrompt) ? "프롬프트" : null,
                   d.files.length ? "파일" : null,
                   d.links.length ? "링크" : null].filter(Boolean).join(" · ");
    const stale = aiStale(r, d);
    head.innerHTML = `<span class="day-date">${fmtDate(d.date)}</span>
      <span class="day-meta">${stale ? '<b style="color:var(--warn)">대화 늘어남</b> · ' : ""}${d.total.toLocaleString()}건 → 핵심 ${d.topics.length}${marks ? " · " + marks : ""}</span>`;
    head.onclick = () => {
      S.date = (S.date === d.date && box.classList.contains("open")) ? null : d.date;
      S.topicId = null;
      renderKeeping(`[data-day="${d.date}"]`);
    };
    box.appendChild(head);

    const tp = el("div", "day-topics");
    if (!d.topics.length) {
      tp.appendChild(el("div", "topic-meta", "이 날은 건질 만한 내용 없이 사담 위주예요."));
    }
    for (const t of d.topics) {
      const ai = aiTopic(r, d.date, t.id);
      const b = el("button", "topic" + (t.id === S.topicId ? " on" : "") + (ai ? " ai" : ""));
      b.dataset.topic = t.id;
      b.innerHTML = `<div class="topic-title">${esc(ai && ai.title ? ai.title : t.title)}</div>
        <div class="topic-body"><ul>${t.bullets.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="topic-meta">
          ${t.labels.map(l => `<span class="tag cat">${esc(l)}</span>`).join("")}
          <span>${t.time} · ${t.users}명 · 원본 ${t.raw}건</span>
          ${t.hasPrompt ? '<span class="tag">프롬프트</span>' : ""}
          ${t.hasFile ? '<span class="tag">파일</span>' : ""}
          ${t.hasLink ? '<span class="tag">링크</span>' : ""}
        </div>`;
      b.onclick = () => {
        S.date = d.date; S.topicId = t.id;
        renderKeeping(`[data-topic="${CSS.escape(t.id)}"]`);
        jumpTo(t.anchor, t.marks);
      };
      tp.appendChild(b);
    }
    box.appendChild(tp);
    list.appendChild(box);
  }
  left.appendChild(list);

  const right = el("div", "pane-right");
  const d = dayOf(S.date);
  const rh = el("div", "pane-head");
  rh.innerHTML = d
    ? `<span>${fmtDateFull(d.date)}</span><span style="font-weight:500;color:var(--text-3)">전체 ${d.total.toLocaleString()}건</span><span class="spacer"></span>`
    : `<span>대화 원문</span><span class="spacer"></span>`;
  if (d) {
    const busy = S.busy === d.date;
    const has = !!aiDay(r, d.date);
    const stale = aiStale(r, d);
    const ai = el("button", "btn sm primary", busy
      ? `<span class="spin">◌</span> ${esc(S.busyNote || "정리 중…")}`
      : (stale ? "늘어난 대화까지 다시 정리" : has ? "AI로 다시 정리" : "AI로 정리"));
    ai.disabled = busy;
    // 얼마나 나갈지 모르는 채로 누르게 두지 않는다. 보낼 분량을 미리 보여준다.
    ai.title = `이 날 보낼 분량: 약 ${dayPayload(d).length.toLocaleString()}자 ` +
      `(전체 ${d.total.toLocaleString()}건 가운데 걸러 남은 것만)`;
    ai.onclick = () => runSummary(d.date, () => summarizeDay(r, d));
    rh.appendChild(ai);

    const t = el("button", "btn sm", S.hideChatter ? "사담 접어둠" : "전부 보는 중");
    t.onclick = () => { S.hideChatter = !S.hideChatter; render(); };
    rh.appendChild(t);
    const c = el("button", "btn sm", "이 날 요약 복사");
    c.onclick = () => copyDay(d);
    rh.appendChild(c);
  }
  right.appendChild(rh);

  if (!d) {
    right.appendChild(el("div", "empty", `<h2>왼쪽에서 날짜나 요약을 눌러보세요</h2>
      <p>요약을 누르면 바로 그 시점의 실제 대화가 여기에 펼쳐지고, 해당 메시지가 노랗게 표시돼요.</p>`));
  } else {
    const body = el("div", "right-body");
    const sc = el("div", "scroll");
    sc.id = "chatScroll";
    sc.appendChild(renderChat(d));
    body.appendChild(sc);
    body.appendChild(renderDigest(d));
    right.appendChild(body);
  }

  main.appendChild(left);
  main.appendChild(right);
}

// 줄글로 늘어놓으면 눈에 안 들어온다. 대항목·소항목으로 세워 보여준다.
// 예전에 문장으로 저장해둔 요약도 있어서 두 모양을 다 받는다.
function outlineSections(v) {
  if (!v) return [];
  if (typeof v === "string") return [{ heading: "", points: v.split(/\n+/).filter(Boolean) }];
  return (v.sections || []).filter(s => s && (s.heading || (s.points || []).length));
}

function aiOutline(tag, v) {
  const b = el("div", "ai-block");
  b.innerHTML = `<div class="ai-tag">${tag}</div>` + outlineSections(v).map(s =>
    (s.heading ? `<div class="ai-sec">${esc(s.heading)}</div>` : "") +
    ((s.points || []).length ? `<ul>${s.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "")
  ).join("");
  return b;
}

// 오른쪽 남는 폭에 '지금 보고 있는 것'의 정리를 채운다.
// 요약 카드를 고르면 그 덩어리의 알맹이 발언을, 날짜만 고르면 그 날 개요를 보여준다.
function renderDigest(d) {
  const box = el("aside", "digest");
  const topic = d.topics.find(t => t.id === S.topicId);

  const quote = (m, cap) => {
    const b = el("button", "quote");
    const t = m.text.replace(/\s+\n/g, "\n").trim();
    b.innerHTML = `<div class="q-who">${esc(m.user)} · ${m.time}</div>
      <div class="q-text">${esc(t.length > cap ? t.slice(0, cap) + "…" : t)}</div>`;
    b.onclick = () => jumpTo(m.i, [m.i]);
    return b;
  };

  const r = room();
  const aiBlock = (tag, body, points) => {
    const b = el("div", "ai-block");
    b.innerHTML = `<div class="ai-tag">${tag}</div>` +
      String(body || "").split(/\n+/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("") +
      (points && points.length ? `<ul>${points.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "");
    return b;
  };

  if (topic) {
    const ai = aiTopic(r, d.date, topic.id);
    box.appendChild(el("h3", null, esc(ai && ai.title ? ai.title : topic.title)));
    box.appendChild(el("div", "sub",
      `${topic.time} · ${topic.users}명이 주고받음 · 원본 ${topic.raw}건` +
      (topic.labels.length ? ` · ${topic.labels.map(esc).join(", ")}` : "")));
    if (ai && (ai.summary || (ai.points || []).length)) {
      box.appendChild(aiBlock("AI 정리", ai.summary || "", ai.points));
    }

    const items = d.msgs.filter(m => topic.marks.includes(m.i));
    const core = [...items].sort((a, b) => b.score - a.score).slice(0, 8).sort((a, b) => a.i - b.i);
    box.appendChild(el("div", "sec", "무슨 얘기였나"));
    for (const m of core) box.appendChild(quote(m, 300));

    const links = items.flatMap(m => m.links);
    if (links.length) {
      box.appendChild(el("div", "sec", "여기서 나온 링크"));
      for (const u of links) {
        const a = el("div", "link-row");
        a.innerHTML = `<span class="dom">${esc(domainOf(u))}</span>
          <a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(snippet(u, 46))}</a>`;
        box.appendChild(a);
      }
    }
    const files = items.filter(m => m.file);
    if (files.length) {
      box.appendChild(el("div", "sec", "여기서 오간 파일"));
      for (const m of files) box.appendChild(el("div", "stat", `<span>${esc(m.file)}</span><b>${esc(m.user)}</b>`));
    }
    return box;
  }

  const kept = d.msgs.filter(m => m.keep).length;
  box.appendChild(el("h3", null, fmtDateFull(d.date)));
  box.appendChild(el("div", "sub",
    `전체 ${d.total.toLocaleString()}건 가운데 ${kept}건만 알맹이로 남았어요`));

  const dayAI = aiDay(r, d.date);
  if (dayAI && dayAI.day) box.appendChild(aiOutline("이 날 AI 정리", dayAI.day));
  else box.appendChild(el("div", "sub",
    `AI로 정리하면 약 ${dayPayload(d).length.toLocaleString()}자를 보내요. 원문 전체가 아니라 걸러 남은 것만이에요.`));

  if (d.topics.length) {
    box.appendChild(el("div", "sec", `이 날 오간 이야기 ${d.topics.length}가지`));
    for (const t of d.topics) {
      const b = el("button", "mini");
      b.innerHTML = `<span class="t">${t.time.slice(0, 5)}</span>${esc(t.title)}`;
      b.onclick = () => { S.topicId = t.id; render(); jumpTo(t.anchor, t.marks); };
      box.appendChild(b);
    }
  }

  const talkers = new Map();
  for (const m of d.msgs) if (!m.sys && !m.bot && m.user) talkers.set(m.user, (talkers.get(m.user) || 0) + 1);
  const top = [...talkers.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (top.length) {
    box.appendChild(el("div", "sec", "많이 말한 사람"));
    for (const [u, n] of top) box.appendChild(el("div", "stat", `<span>${esc(u)}</span><b>${n}건</b>`));
  }

  box.appendChild(el("div", "sec", "이 날 모인 자료"));
  box.appendChild(el("div", "stat", `<span>프롬프트</span><b>${d.prompts.length}개</b>`));
  box.appendChild(el("div", "stat", `<span>파일</span><b>${d.files.length}개</b>`));
  box.appendChild(el("div", "stat", `<span>링크</span><b>${d.links.reduce((n, m) => n + m.links.length, 0)}개</b>`));
  return box;
}

// 어느 메시지의 사진인지 알아낸 경우엔 대화 원문에 바로 붙여 보여준다.
// 메시지마다 훑으면 느려서, 화면을 그릴 때 한 번만 묶어 둔다.
let mediaIndex = new Map();
function buildMediaIndex() {
  mediaIndex = new Map();
  const r = room();
  for (const x of (r && r.media) || []) {
    if (x.mi == null) continue;
    if (!mediaIndex.has(x.mi)) mediaIndex.set(x.mi, []);
    mediaIndex.get(x.mi).push(x);
  }
}
const mediaFor = mi => mediaIndex.get(mi) || [];

function msgNode(m, prevUser, dim) {
  if (m.sys) {
    const s = el("div", "msg sys");
    s.id = "m" + m.i;
    s.innerHTML = `<div class="msg-main">${esc(m.text)}</div>`;
    return s;
  }
  const shots = mediaFor(m.i);
  const e = el("div", "msg" + (m.user === prevUser ? " same" : "") + (dim ? " dim" : ""));
  e.id = "m" + m.i;
  // 사진이 바로 아래 붙는데 해시 파일 이름까지 적어 두면 어수선하다
  const bare = m.text.trim();
  const named = shots.length && RE_ONE_MEDIA.test(bare);
  const text = named ? (kindOf(bare) === "video" ? "동영상" : "사진") : m.text;

  const badges = [];
  if (m.prompt) badges.push('<span class="badge p">프롬프트</span>');
  if (m.file && !named) {
    // 사진이 오갔다는 표시만 있고 파일이 없으면, 왜 안 보이는지 그 자리에서 밝힌다
    badges.push(isPlaceholderFile(m.file) && !shots.length
      ? `<span class="badge">${esc(m.file)} · 원본은 카톡에서</span>`
      : `<span class="badge f">${esc(m.file)}</span>`);
  }
  for (const l of m.links.slice(0, 3)) badges.push(`<span class="badge l">${esc(domainOf(l))}</span>`);
  e.innerHTML = `<div class="msg-side">${m.time}</div>
    <div class="msg-main">
      <div class="msg-who">${esc(m.user)}</div>
      <div class="msg-text">${linkify(text)}</div>
      ${badges.length ? `<div class="msg-badges">${badges.join("")}</div>` : ""}
    </div>`;
  if (shots.length) {
    const box = renderShots(shots);
    box.classList.add("in-chat");
    e.querySelector(".msg-main").appendChild(box);
  }
  return e;
}

function renderChat(d) {
  const wrap = el("div", "chat");
  let prevUser = null;
  let run = [];

  // 오픈채팅방은 봇 안내와 입·퇴장이 하루에 수백 줄씩 쌓인다. 흐리게만 두면
  // 여전히 화면을 다 잡아먹으므로, 연달아 나오면 한 줄로 접어둔다.
  const flush = () => {
    if (!run.length) return;
    if (run.length >= 3) {
      const items = run;
      const b = el("button", "fold");
      b.dataset.holds = items.map(m => m.i).join(",");
      const joins = items.filter(m => m.sys).length;
      const parts = [];
      if (items.length - joins) parts.push(`잡담 ${items.length - joins}줄`);
      if (joins) parts.push(`입·퇴장 ${joins}줄`);
      b.innerHTML = `<span class="bar"></span>${parts.join(" · ")} 접힘 — 눌러서 펼치기`;
      b.onclick = () => {
        let p = null;
        for (const m of items) { b.before(msgNode(m, p, true)); p = m.sys ? null : m.user; }
        b.remove();
      };
      wrap.appendChild(b);
    } else {
      let p = prevUser;
      for (const m of run) { wrap.appendChild(msgNode(m, p, true)); p = m.sys ? null : m.user; }
    }
    prevUser = null;
    run = [];
  };

  for (const m of d.msgs) {
    const folded = S.hideChatter && (m.sys || !m.keep);
    if (folded) { run.push(m); continue; }
    flush();
    wrap.appendChild(msgNode(m, prevUser, false));
    prevUser = m.sys ? null : m.user;
  }
  flush();
  return wrap;
}

// 접혀 있는 줄로 이동해야 하면 그 묶음만 펼치고 간다
function expandFoldFor(i) {
  for (const b of document.querySelectorAll(".fold")) {
    if ((b.dataset.holds || "").split(",").includes(String(i))) { b.click(); return true; }
  }
  return false;
}

// render()가 동기이므로 DOM은 이미 준비돼 있다. 화면이 안 그려지는 상황에서는
// requestAnimationFrame이 아예 돌지 않으므로 여기에 기대지 않는다.
function jumpTo(anchor, marks) {
  // 방금 render()가 예약해둔 스크롤 복원이 이 이동을 되돌리지 못하게 막는다
  if (pendingChatRestore) { clearTimeout(pendingChatRestore); pendingChatRestore = null; }
  for (const i of [...(marks || []), anchor]) {
    if (!document.getElementById("m" + i)) expandFoldFor(i);
  }
  for (const i of marks || []) {
    const n = document.getElementById("m" + i);
    if (n) { n.classList.add("hl"); n.classList.remove("dim"); }
  }
  // scrollIntoView의 부드러운 이동은 화면이 안 그려지는 동안 진행되지 않는다.
  // 컨테이너 기준 위치를 직접 계산해 곧바로 옮긴다.
  const a = document.getElementById("m" + anchor);
  if (!a) return;
  const box = a.closest(".scroll");
  if (box) box.scrollTop += a.getBoundingClientRect().top - box.getBoundingClientRect().top - 16;
  else a.scrollIntoView({ block: "start" });
}

/* ── 자료함 뷰 ── */
function vaultItems(d, kind) {
  const out = [];
  if (kind === "all" || kind === "prompt") for (const m of d.prompts) out.push({ kind: "prompt", m });
  if (kind === "all" || kind === "file") for (const m of d.files) out.push({ kind: "file", m });
  if (kind === "all" || kind === "link") for (const m of d.links) out.push({ kind: "link", m });
  return out.sort((a, b) => a.m.i - b.m.i);
}

// 미리보기용 주소는 쓰고 나면 반드시 놓아준다. 안 그러면 사진 수백 장이 메모리에 쌓인다.
let shotUrls = [];
function freeShots() {
  for (const u of shotUrls) URL.revokeObjectURL(u);
  shotUrls = [];
}
const shotUrl = blob => {
  const u = URL.createObjectURL(blob);
  shotUrls.push(u);
  return u;
};

function openViewer(item) {
  const v = $("#viewer");
  const url = URL.createObjectURL(item.blob);
  v.innerHTML = item.kind === "video"
    ? `<video src="${url}" controls autoplay></video><div class="cap">${esc(item.name)}</div>`
    : `<img src="${url}" alt="${esc(item.name)}"><div class="cap">${esc(item.name)}</div>`;
  v.hidden = false;
  v.onclick = () => { v.hidden = true; v.innerHTML = ""; URL.revokeObjectURL(url); };
}

function renderShots(items) {
  const grid = el("div", "shots");
  for (const it of items) {
    const b = el("button", "shot");
    b.innerHTML = it.kind === "video"
      ? `<video src="${shotUrl(it.blob)}" muted preload="metadata"></video><span class="tag">동영상</span>`
      : `<img src="${shotUrl(it.blob)}" alt="${esc(it.name)}" loading="lazy">`;
    b.onclick = () => openViewer(it);
    grid.appendChild(b);
  }
  return grid;
}

function renderVault(main) {
  const r = room();
  const left = el("div", "pane-left");
  left.appendChild(el("div", "pane-head", "<span>자료가 올라온 날</span>"));
  const list = el("div", "scroll");
  list.id = "leftScroll";

  const total = { p: 0, f: 0, l: 0 };
  for (const d of r.days) { total.p += d.prompts.length; total.f += d.files.length; total.l += d.links.length; }

  const allBtn = el("div", "day" + (S.date === null ? " on" : ""));
  const ah = el("button", "day-head");
  ah.innerHTML = `<span class="day-date">전체 기간</span>
    <span class="day-meta">프롬프트 ${total.p} · 파일 ${total.f} · 링크 ${total.l}</span>`;
  ah.onclick = () => { S.date = null; render(); };
  allBtn.appendChild(ah);
  list.appendChild(allBtn);

  for (const d of r.days) {
    const n = d.prompts.length + d.files.length + d.links.length;
    if (!n) continue;
    const box = el("div", "day" + (d.date === S.date ? " on" : ""));
    const head = el("button", "day-head");
    const bits = [d.prompts.length ? `프롬프트 ${d.prompts.length}` : null,
                  d.files.length ? `파일 ${d.files.length}` : null,
                  d.links.length ? `링크 ${d.links.length}` : null].filter(Boolean);
    head.innerHTML = `<span class="day-date">${fmtDate(d.date)}</span>
      <span class="day-meta">${bits.join(" · ")}</span>`;
    head.onclick = () => { S.date = d.date; render(); };
    box.appendChild(head);
    list.appendChild(box);
  }
  left.appendChild(list);

  const right = el("div", "pane-right");
  const rh = el("div", "pane-head");
  const chips = el("div", "chips");
  const shots = r.media || [];
  const kinds = [["all", "전체"], ["prompt", "프롬프트"], ["file", "파일"], ["link", "링크"]];
  // 압축파일로 넣은 방에서만 사진 칩이 뜬다
  if (shots.length) kinds.push(["shot", `사진·동영상 ${shots.length}`]);
  for (const [k, label] of kinds) {
    const c = el("button", "chip" + (S.vaultKind === k ? " on" : ""), label);
    c.onclick = () => { S.vaultKind = k; render(); };
    chips.appendChild(c);
  }
  rh.appendChild(el("span", null, S.date ? fmtDateFull(S.date) : "전체 기간"));
  rh.appendChild(el("span", "spacer"));

  // 사진 탭에서는 몇 개가 대화 원문까지 붙었는지 늘 밝힌다. 안 붙었으면 근거를 건네준다.
  if (S.vaultKind === "shot" && shots.length) {
    const inChat = shots.filter(x => x.mi != null).length;
    rh.appendChild(el("span", null,
      `<span style="font-weight:500;color:var(--text-3)">대화 원문에 붙은 것 ${inChat}/${shots.length}</span>`));
    const b = el("button", "btn sm", "진단 복사");
    b.onclick = () => {
      const diag = r.mediaDiag || {
        파일: shots.length, 대화에붙음: inChat,
        메모: "불러온 뒤 새로고침해서 자세한 근거가 없어요. zip을 다시 넣으면 채워져요.",
      };
      navigator.clipboard.writeText(JSON.stringify(diag, null, 1)).then(
        () => toast("복사했어요. 그대로 붙여넣어 물어보면 돼요."),
        () => toast("복사에 실패했어요"));
    };
    rh.appendChild(b);
  }
  rh.appendChild(chips);
  right.appendChild(rh);

  const days = S.date ? [dayOf(S.date)].filter(Boolean) : r.days;
  const sc = el("div", "scroll");
  sc.id = "rightScroll";
  const cards = el("div", "cards");
  let n = 0;

  if (S.vaultKind === "shot") {
    // 파일 이름에 날짜가 있으면 날짜별로 묶고, 없는 것은 맨 아래 따로 모은다
    const pick = S.date ? shots.filter(x => x.date === S.date) : shots;
    const byDate = new Map();
    for (const x of pick) {
      const k = x.date || "";
      if (!byDate.has(k)) byDate.set(k, []);
      byDate.get(k).push(x);
    }
    const keys = [...byDate.keys()].sort((a, b) => (a && b ? (a < b ? 1 : -1) : a ? -1 : 1));
    for (const k of keys) {
      const h = el("div", "topic-meta",
        `<b style="color:var(--text-2)">${k ? esc(fmtDate(k)) : "날짜를 알 수 없는 것"}</b> · ${byDate.get(k).length}개`);
      h.style.margin = "6px 0 -2px";
      cards.appendChild(h);
      cards.appendChild(renderShots(byDate.get(k)));
      n += byDate.get(k).length;
    }
    if (!n && S.date) {
      cards.appendChild(el("div", "note",
        "이 날짜로 묶인 사진이 없어요. 파일 이름에 날짜가 없으면 왼쪽에서 <b>전체 기간</b>을 골라야 보여요."));
      n = 1;
    }
    if (n) { sc.appendChild(cards); right.appendChild(sc); }
    else right.appendChild(el("div", "empty", "<h2>사진·동영상이 없어요</h2>"));
    main.appendChild(left);
    main.appendChild(right);
    return;
  }

  for (const d of days) {
    const items = vaultItems(d, S.vaultKind);
    if (!items.length) continue;
    if (!S.date) {
      const h = el("div", "topic-meta", `<b style="color:var(--text-2)">${fmtDate(d.date)}</b>`);
      h.style.margin = "6px 0 -4px";
      cards.appendChild(h);
    }
    for (const it of items) { cards.appendChild(vaultCard(it, d)); n++; }
  }

  if (!n) {
    right.appendChild(el("div", "empty", `<h2>해당하는 자료가 없어요</h2>
      <p>프롬프트는 길이·구조·키워드로, 파일은 첨부 표시로, 링크는 주소로 자동으로 골라내요.</p>`));
  } else {
    sc.appendChild(cards);
    right.appendChild(sc);
  }
  main.appendChild(left);
  main.appendChild(right);
}

function vaultCard(it, d) {
  const m = it.m;
  const card = el("div", "card");
  const head = el("div", "card-head");
  const kindLabel = { prompt: "프롬프트", file: "파일", link: "링크" }[it.kind];
  const kindCls = { prompt: "p", file: "f", link: "l" }[it.kind];
  head.innerHTML = `<span class="badge ${kindCls}">${kindLabel}</span>
    <span class="who">${esc(m.user || "알 수 없음")}</span>
    <span>${fmtDate(m.date)} ${m.time}</span><span class="spacer"></span>`;

  const copy = el("button", "btn sm", "복사");
  copy.onclick = () => {
    navigator.clipboard.writeText(m.text).then(
      () => toast("복사했어요"),
      () => toast("복사에 실패했어요")
    );
  };
  head.appendChild(copy);

  const go = el("button", "btn sm", "대화에서 보기");
  go.onclick = () => {
    keepRoomState();   // 자료함에서 보던 자리를 잃지 않는다
    S.view = "summary"; S.date = m.date; S.topicId = null;
    render();
    jumpTo(m.i, [m.i]);
  };
  head.appendChild(go);
  card.appendChild(head);

  if (it.kind === "link") {
    const body = el("div", "card-body");
    body.innerHTML = m.links.map(u =>
      `<div class="link-row"><span class="dom">${esc(domainOf(u))}</span>
       <a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></div>`
    ).join("") + (m.text.replace(RE_URL, "").trim()
      ? `<div style="margin-top:6px;color:var(--text-2);font-size:12.5px">${esc(snippet(m.text, 140))}</div>` : "");
    card.appendChild(body);
  } else {
    card.appendChild(el("div", "card-body" + (it.kind === "prompt" ? " code" : ""), esc(m.text)));
  }
  return card;
}

/* ── 월간 뷰 ── */
function monthsOf(r) {
  const map = new Map();
  for (const d of r.days) {
    const m = d.date.slice(0, 7);
    if (!map.has(m)) map.set(m, []);
    map.get(m).push(d);
  }
  return [...map.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1));
}
const fmtMonth = m => `${m.slice(0, 4)}년 ${Number(m.slice(5))}월`;

function renderMonth(main) {
  const r = room();
  const months = monthsOf(r);
  if (S.month && !months.some(([m]) => m === S.month)) S.month = null;
  if (!S.month && months.length) S.month = months[0][0];

  const left = el("div", "pane-left");
  left.appendChild(el("div", "pane-head", `<span>달별로 묶어 보기</span>`));
  const list = el("div", "scroll");
  list.id = "leftScroll";
  for (const [m, days] of months) {
    const done = days.filter(d => aiDay(r, d.date)).length;
    const box = el("div", "day" + (m === S.month ? " on" : ""));
    const head = el("button", "day-head");
    head.innerHTML = `<span class="day-date">${fmtMonth(m)}</span>
      <span class="day-meta">${days.length}일 · AI 정리 ${done}/${days.length}일</span>`;
    head.onclick = () => { S.month = m; render(); };
    box.appendChild(head);
    list.appendChild(box);
  }
  left.appendChild(list);

  const right = el("div", "pane-right");
  const days = (months.find(([m]) => m === S.month) || [null, []])[1];
  const done = days.filter(d => aiDay(r, d.date));
  const rec = S.month ? S.sums[`${r.id}|${S.month}`] : null;

  const rh = el("div", "pane-head");
  rh.appendChild(el("span", null, S.month ? fmtMonth(S.month) : "달을 고르세요"));
  rh.appendChild(el("span", "spacer"));
  if (S.month) {
    const busy = S.busy === S.month;
    // 아직 안 한 날과, 정리한 뒤로 대화가 늘어난 날을 함께 대상으로 본다
    const fresh = days.filter(d => !aiDay(r, d.date));
    const grown = days.filter(d => aiStale(r, d));
    const left2 = days.filter(d => !aiDay(r, d.date) || aiStale(r, d));
    const todoLabel = [fresh.length ? `안 된 ${fresh.length}일` : "", grown.length ? `늘어난 ${grown.length}일` : ""]
      .filter(Boolean).join(" + ");

    if (busy) {
      rh.appendChild(el("span", "btn sm", `<span class="spin">◌</span> ${esc(S.busyNote || "정리 중…")}`));
      const stop = el("button", "btn sm", S.stop ? "멈추는 중…" : "멈춤");
      stop.disabled = S.stop;
      stop.onclick = () => { S.stop = true; render(); };
      rh.appendChild(stop);
    } else {
      if (left2.length) {
        // 누르기 전에 몇 일치가 얼마나 나가는지 밝힌다
        const chars = left2.reduce((n, d) => n + dayPayload(d).length, 0);
        const all = el("button", "btn sm primary", `${todoLabel} 한꺼번에`);
        all.title = `보낼 분량 약 ${chars.toLocaleString()}자 (${left2.length}일치 합계). 도중에 멈출 수 있어요.`;
        all.onclick = () => {
          if (!confirm(`${todoLabel}을 이어서 돌릴게요. (모두 ${left2.length}일)\n` +
                       `보낼 분량은 합쳐서 약 ${chars.toLocaleString()}자예요.\n` +
                       `도중에 멈출 수 있고, 끝난 날은 저장되니 다시 눌러도 낭비되지 않아요.`)) return;
          runSummary(S.month, async () => {
            const res = await summarizeDays(r, left2, busyNote);
            toast(`${res.done}일 정리했어요${res.done < res.total ? " (멈춤)" : ""}`);
          });
        };
        rh.appendChild(all);
      }
      const b = el("button", "btn sm" + (left2.length ? "" : " primary"),
        rec ? "달 요약 다시 만들기" : "달 요약 만들기");
      b.disabled = !days.length;
      b.title = left2.length
        ? `${todoLabel}을 먼저 돌리고 이어서 달 요약까지 만들어요.`
        : `날짜별 정리 ${done.length}일치를 재료로 씁니다. 원본 대화를 다시 보내지 않아 값이 적게 나가요.`;
      b.onclick = () => {
        // 달 요약은 날짜별 정리를 재료로 쓴다. 재료가 빠졌으면 그것부터 채우고 이어서 간다.
        if (left2.length) {
          const chars = left2.reduce((n, d) => n + dayPayload(d).length, 0);
          if (!confirm(`${todoLabel}이 남아 있어요. (모두 ${left2.length}일)\n` +
                       `그 ${left2.length}일(약 ${chars.toLocaleString()}자)을 먼저 돌리고, 이어서 달 요약까지 만들까요?\n` +
                       `도중에 '멈춤'을 누르면 거기서 세울 수 있어요.`)) return;
          runSummary(S.month, async () => {
            const res = await summarizeDays(r, left2, busyNote);
            if (S.stop) {
              toast(`${res.done}일 정리하고 멈췄어요. 달 요약은 아직 만들지 않았어요.`);
              return;
            }
            busyNote("이제 달 요약을 만드는 중…");
            await summarizeMonth(r, S.month, days);
          });
          return;
        }
        runSummary(S.month, () => summarizeMonth(r, S.month, days));
      };
      rh.appendChild(b);
    }
  }
  right.appendChild(rh);

  const sc = el("div", "scroll");
  sc.id = "rightScroll";
  const cards = el("div", "cards");

  if (!done.length) {
    // 달 요약은 날짜별 AI 정리를 재료로 쓴다. 재료가 없으면 만들 수가 없다.
    cards.appendChild(el("div", "note", `<b>이 달은 아직 정리한 날짜가 없어요.</b>
      달 요약은 원본 대화가 아니라 <b>그 달의 날짜별 정리</b>를 재료로 만들어요.
      그래서 달 요약 자체는 값이 얼마 안 나가고, 날짜별 정리를 채우는 쪽이 실제 비용이에요.
      <br><br>위 버튼 두 개는 이렇게 나뉘어요.
      <ul>
        <li><b>안 된 ○일 한꺼번에</b> — 날짜별 정리만 채워요. 달 요약은 안 만들어요.</li>
        <li><b>달 요약 만들기</b> — 안 된 날이 있으면 <b>그걸 먼저 채우고 이어서</b> 달 요약까지 만들어요.</li>
      </ul>
      어느 쪽이든 누르기 전에 보낼 분량이 몇 자인지 알려주고, 도중에 <b>멈춤</b>으로 세울 수 있어요.
      끝난 날은 그때그때 저장되니 다시 눌러도 그 날은 건너뛰어요.
      ${aiReady() ? "" : "<br><br>아직 API 키를 넣지 않았다면 오른쪽 위 <b>AI 요약 설정</b>부터 열어주세요."}`));
  } else {
    if (rec) {
      const head = el("div", "card");
      const body = el("div", "card-body");
      body.appendChild(aiMonthBlock(rec));
      head.appendChild(el("div", "card-head", `<span class="badge p">이 달 정리</span>
        <span>${esc(fmtMonth(S.month))} · 날짜 ${done.length}일치를 묶음</span>`));
      head.appendChild(body);
      cards.appendChild(head);
    }
    cards.appendChild(el("div", "topic-meta",
      `<b style="color:var(--text-2)">날짜별 정리 ${done.length}일치</b>`));
    for (const d of done) {
      const s = aiDay(r, d.date);
      const card = el("div", "card");
      const h = el("div", "card-head");
      h.innerHTML = `<span class="who">${esc(fmtDate(d.date))}</span>
        <span>전체 ${d.total.toLocaleString()}건</span><span class="spacer"></span>`;
      const go = el("button", "btn sm", "그 날 보기");
      go.onclick = () => {
        keepRoomState();   // 월간에서 보던 달을 잃지 않는다
        S.view = "summary"; S.date = d.date; S.topicId = null; render();
      };
      h.appendChild(go);
      card.appendChild(h);
      const body = el("div", "card-body");
      body.appendChild(aiOutline("정리", s.day));
      const titles = d.topics.map(t => (s.topics[t.id] || {}).title).filter(Boolean);
      if (titles.length) {
        body.innerHTML += `<div class="topic-meta" style="margin-top:8px">${
          titles.map(x => `<span class="tag cat">${esc(x)}</span>`).join("")}</div>`;
      }
      card.appendChild(body);
      cards.appendChild(card);
    }
  }
  sc.appendChild(cards);
  right.appendChild(sc);

  main.appendChild(left);
  main.appendChild(right);
}

function aiMonthBlock(rec) {
  const wrap = el("div");
  if (rec.month) wrap.appendChild(aiOutline("한 달 흐름", rec.month));
  for (const t of rec.themes || []) {
    const b = el("div", "ai-block");
    b.innerHTML = `<div class="ai-tag">${esc(t.title || "주제")}</div><p>${esc(t.summary || "")}</p>` +
      ((t.days || []).length ? `<div class="topic-meta">${
        t.days.map(x => `<span class="tag cat">${esc(x)}</span>`).join("")}</div>` : "");
    wrap.appendChild(b);
  }
  return wrap;
}

/* ── 검색 뷰 ── */
function renderSearch(main) {
  const r = room();
  const left = el("div", "pane-left");
  const wrap = el("div", "search-wrap");
  const input = el("input", "search-box");
  input.type = "search";
  input.placeholder = "이 방 전체에서 검색 (예: n8n, 프롬프트)";
  input.value = S.query;
  wrap.appendChild(input);
  left.appendChild(wrap);

  const list = el("div", "scroll");
  list.id = "leftScroll";
  left.appendChild(list);

  const right = el("div", "pane-right");
  const rhead = el("div", "pane-head", "<span>검색 결과에서 고르면 원문이 여기 나와요</span>");
  right.appendChild(rhead);
  const rbody = el("div", "scroll");
  right.appendChild(rbody);

  const draw = () => {
    list.innerHTML = "";
    const q = S.query.trim().toLowerCase();
    if (q.length < 2) {
      list.appendChild(el("div", "topic-meta", "<div style='padding:14px'>두 글자 이상 입력해 주세요.</div>"));
      return;
    }
    const hits = r.messages.filter(m => !m.sys && m.text.toLowerCase().includes(q)).slice(0, 300);
    const head = el("div", "topic-meta");
    head.style.padding = "8px 14px";
    head.textContent = `${hits.length}건${hits.length === 300 ? " 이상" : ""} 찾음`;
    list.appendChild(head);

    for (const m of hits) {
      const b = el("button", "hit");
      const t = esc(snippet(m.text, 170));
      const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
      b.innerHTML = `<div class="hit-meta">${fmtDate(m.date)} ${m.time} · ${esc(m.user)}</div>
        <div class="hit-text">${t.replace(re, x => `<mark>${x}</mark>`)}</div>`;
      b.onclick = () => {
        const d = dayOf(m.date);
        rhead.innerHTML = `<span>${fmtDateFull(d.date)}</span>
          <span style="font-weight:500;color:var(--text-3)">전체 ${d.total.toLocaleString()}건</span>`;
        rbody.innerHTML = "";
        rbody.appendChild(renderChat(d));
        jumpTo(m.i, [m.i]);
      };
      list.appendChild(b);
    }
  };

  let t = null;
  input.oninput = () => { S.query = input.value; clearTimeout(t); t = setTimeout(draw, 180); };
  draw();

  main.appendChild(left);
  main.appendChild(right);
  setTimeout(() => input.focus(), 0);
}

// 날짜나 요약을 누를 때마다 화면을 다시 그리는데, 그때 왼쪽 목록이 맨 위로
// 튀면 아래쪽 날짜를 볼 때마다 다시 스크롤해야 한다. 위치를 기억했다가 되돌린다.
let lastDrawn = null, lastChatKey = null, lastRightKey = null, pendingChatRestore = null;
const scrollMem = {};

function render() {
  const prev = document.getElementById("leftScroll");
  if (prev && lastDrawn) scrollMem[lastDrawn] = prev.scrollTop;
  const prevChat = document.getElementById("chatScroll");
  if (prevChat && lastChatKey) scrollMem[lastChatKey] = prevChat.scrollTop;
  // 자료함·월간의 오른쪽 목록도 어디까지 봤는지 적어 둔다
  const prevRight = document.getElementById("rightScroll");
  if (prevRight && lastRightKey) scrollMem[lastRightKey] = prevRight.scrollTop;

  renderRooms();
  freeShots();
  buildMediaIndex();
  const main = $("#main");
  main.innerHTML = "";
  $("#views").style.display = S.rooms.length ? "flex" : "none";
  for (const b of document.querySelectorAll(".view-tab"))
    b.classList.toggle("on", b.dataset.view === S.view);

  if (!S.rooms.length) { lastDrawn = lastChatKey = lastRightKey = null; renderEmpty(main); return; }
  const r = room();
  if (!r) { S.roomId = S.rooms[0].id; return render(); }
  if (S.view === "summary") renderSummary(main);
  else if (S.view === "vault") renderVault(main);
  else if (S.view === "month") renderMonth(main);
  else renderSearch(main);

  const key = `${S.roomId}|${S.view}`;
  const now = document.getElementById("leftScroll");
  if (now && scrollMem[key]) {
    now.scrollTop = scrollMem[key];
    setTimeout(() => { now.scrollTop = scrollMem[key]; }, 0);
  }
  // 사담 접기를 켜고 끌 때 대화가 맨 위로 튀지 않게, 같은 날짜를 다시 그릴 때만 되돌린다
  const chatKey = `${key}|${S.date}`;
  const chat = document.getElementById("chatScroll");
  if (chat && lastChatKey === chatKey && scrollMem[chatKey]) {
    const y = scrollMem[chatKey];
    chat.scrollTop = y;
    // 이 복원이 곧이어 실행될 jumpTo의 이동을 덮어쓰지 않도록 취소할 수 있게 잡아둔다
    pendingChatRestore = setTimeout(() => { chat.scrollTop = y; pendingChatRestore = null; }, 0);
  }
  // 목록을 실제로 결정하는 것만 이름에 담는다. 자료함은 날짜와 갈래, 월간은 달이다.
  // 상관없는 것까지 섞으면 다른 탭에 다녀온 것만으로 다른 목록이 돼 자리를 잃는다.
  const rightKey = `${key}|right|` +
    (S.view === "vault" ? `${S.date}|${S.vaultKind}` : S.view === "month" ? String(S.month) : "");
  const right = document.getElementById("rightScroll");
  if (right && scrollMem[rightKey]) {
    const y = scrollMem[rightKey];
    right.scrollTop = y;
    setTimeout(() => { right.scrollTop = y; }, 0);
  }

  lastDrawn = key;
  lastChatKey = chat ? chatKey : null;
  lastRightKey = right ? rightKey : null;
  keepRoomState();
}

// 누른 항목이 화면에서 있던 자리를 그대로 두고 다시 그린다.
// 위쪽 날짜가 접히거나 펼쳐져도 방금 누른 줄이 눈앞에 그대로 남는다.
function renderKeeping(sel) {
  const before = document.querySelector(sel);
  const top = before ? before.getBoundingClientRect().top : null;
  render();
  if (top == null) return;
  const after = document.querySelector(sel);
  const list = document.getElementById("leftScroll");
  if (after && list) list.scrollTop += after.getBoundingClientRect().top - top;
}

/* ── 요약 복사 (마크다운) ── */
function copyDay(d) {
  const r = room();
  const lines = [`## ${fmtDateFull(d.date)} — ${r.name}`, ""];

  // AI 정리가 있으면 그것부터 담는다. 공부하려고 옮겨 적는 게 이 버튼의 쓸모다.
  const s = aiDay(r, d.date);
  if (s) {
    for (const sec of outlineSections(s.day)) {
      if (sec.heading) lines.push(`### ${sec.heading}`);
      for (const p of sec.points || []) lines.push(`- ${p}`);
      lines.push("");
    }
  }

  for (const t of d.topics) {
    const ai = s && s.topics[t.id];
    lines.push(`### ${ai && ai.title ? ai.title : t.title}  (${t.time}, ${t.users}명)`);
    if (ai && ai.summary) lines.push(ai.summary, "");
    for (const b of (ai && ai.points && ai.points.length ? ai.points : t.bullets)) lines.push(`- ${b}`);
    lines.push("");
  }
  if (d.prompts.length) {
    lines.push("### 이 날 공유된 프롬프트", "");
    for (const m of d.prompts) lines.push("```", m.text, "```", "");
  }
  if (d.links.length) {
    lines.push("### 링크");
    for (const m of d.links) for (const u of m.links) lines.push(`- ${u}`);
  }
  navigator.clipboard.writeText(lines.join("\n")).then(
    () => toast("이 날 정리본을 마크다운으로 복사했어요"),
    () => toast("복사에 실패했어요")
  );
}

/* ══════════════════════════════════════════════════════════
   5. 파일 읽기
   ══════════════════════════════════════════════════════════ */

// 카톡 내보내기는 보통 UTF-8이지만 옛날 PC판은 EUC-KR로 나온다.
function decode(buf) {
  const utf8 = new TextDecoder("utf-8").decode(buf);
  const broken = (utf8.match(/�/g) || []).length;
  if (broken > 0 && broken / Math.max(utf8.length, 1) > 0.001) {
    try { return new TextDecoder("euc-kr").decode(buf); } catch (_) {}
  }
  return utf8;
}

/* ── 압축파일(zip) 읽기 ──
   카톡 '모든 메시지 내부저장소에 저장'은 txt와 사진·동영상을 zip 하나로 묶어 준다.
   외부 라이브러리 없이 브라우저가 가진 압축 해제 기능만으로 읽는다. */

function zipEntries(buf) {
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("압축파일을 읽지 못했어요. zip 파일이 맞는지 확인해 주세요.");
  const count = dv.getUint16(eocd + 10, true);
  if (count === 0xffff) throw new Error("파일이 너무 많은 압축파일이라 읽지 못했어요.");

  let off = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let n = 0; n < count; n++) {
    if (off + 46 > buf.byteLength || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const size = dv.getUint32(off + 24, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder("utf-8").decode(new Uint8Array(buf, off + 46, nameLen));
    const lnameLen = dv.getUint16(lho + 26, true);
    const lextraLen = dv.getUint16(lho + 28, true);
    // 압축파일은 파일마다 만든 시각을 함께 담는다. 이름에 날짜가 없을 때 기댈 곳이다.
    const dTime = dv.getUint16(off + 12, true);
    const dDate = dv.getUint16(off + 14, true);
    out.push({
      name, method, size, csize,
      start: lho + 30 + lnameLen + lextraLen,
      mdate: dDate ? `${1980 + (dDate >> 9)}-${pad2((dDate >> 5) & 15)}-${pad2(dDate & 31)}` : null,
      mtime: dDate ? `${pad2(dTime >> 11)}:${pad2((dTime >> 5) & 63)}` : null,
    });
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}

// 카톡 txt는 사진 자리에 '사진' 한 단어만 남긴다. 그 자리들을 순서대로 세어 둔다.
// '사진 3장'은 세 자리로 친다.
function mediaSlots(messages) {
  const slots = [];
  for (const m of messages) {
    if (m.sys) continue;
    const t = m.text.trim();
    const many = t.match(/^사진\s*(\d+)\s*장$/);
    const n = many ? Number(many[1]) : /^<?(사진|동영상)>?$/.test(t) ? 1 : 0;
    for (let k = 0; k < n; k++) slots.push(m);
  }
  return slots;
}

async function zipRead(buf, e) {
  const raw = new Uint8Array(buf, e.start, e.csize);
  if (e.method === 0) return raw;                    // 그냥 담아둔 것
  if (e.method !== 8) throw new Error(`'${e.name}'은 지원하지 않는 압축 방식이에요.`);
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

const MIME = {
  jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif",
  webp: "image/webp", heic: "image/heic", bmp: "image/bmp",
  mp4: "video/mp4", mov: "video/quicktime", webm: "video/webm", m4v: "video/mp4",
  mp3: "audio/mpeg", m4a: "audio/mp4", aac: "audio/aac",
};
// 대화 본문에 박혀 있는 파일 이름을 찾아내는 눈
const RE_MEDIA_TOKEN = /[\w][\w.\-()]*\.(?:jpg|jpeg|png|gif|webp|heic|bmp|mp4|mov|webm|m4v|mp3|m4a|aac)/gi;
// 줄 전체가 파일 이름 하나인 경우 / 사진이 있었다는 표시만 남은 경우
const RE_ONE_MEDIA = /^[\w][\w.\-()]*\.(?:jpg|jpeg|png|gif|webp|heic|bmp|mp4|mov|webm|m4v|mp3|m4a|aac)$/i;
const RE_PLACEHOLDER = /^<?(사진|동영상)>?$/;
const extOf = n => (n.split(".").pop() || "").toLowerCase();
const isMedia = n => !!MIME[extOf(n)];
const kindOf = n => (MIME[extOf(n)] || "").split("/")[0];   // image | video | audio

// 파일 이름에 날짜가 박혀 있으면 그 날 자료로 묶는다. 없으면 날짜 없이 모아 둔다.
function dateInName(n) {
  const m = n.match(/(20\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}

const VIDEO_MAX = 40 * 1024 * 1024;   // 이보다 큰 동영상은 저장 공간을 다 먹어서 건너뛴다

async function handleZip(file) {
  const buf = await file.arrayBuffer();
  const entries = zipEntries(buf).filter(e => !e.name.endsWith("/"));
  const txts = entries.filter(e => /\.(txt|csv)$/i.test(e.name)).sort((a, b) => b.size - a.size);
  if (!txts.length) throw new Error("압축파일 안에서 대화 txt를 찾지 못했어요.");

  const raw = decode((await zipRead(buf, txts[0])).buffer);
  const fallback = file.name.replace(/\.zip$/i, "").replace(/^KakaoTalk(Chats)?[_ -]*/i, "");
  const parsed = parseKakao(raw, fallback || "이름 없는 방");
  if (!parsed.messages.length) throw new Error("압축파일 안의 txt에서 대화를 찾지 못했어요.");
  const r = addRoom(parsed.name, parsed.messages, raw);

  let saved = 0, skipped = 0, attached = 0;
  const media = entries.filter(e => isMedia(e.name));

  // 어느 메시지의 사진인지 알아내는 방법이 둘이다.
  // ① 대화에 파일 이름이 그대로 적혀 있으면 그것으로 맞춘다. 가장 확실하다.
  const byName = new Map(media.map(e => [e.name.split("/").pop().toLowerCase(), e]));
  const owner = new Map();
  for (const m of parsed.messages) {
    if (m.sys) continue;
    for (const tok of m.text.match(RE_MEDIA_TOKEN) || []) {
      const k = tok.toLowerCase();
      if (byName.has(k) && !owner.has(k)) owner.set(k, m);
    }
  }
  const slots = mediaSlots(parsed.messages);
  const rest = media.filter(e => !owner.has(e.name.split("/").pop().toLowerCase()));
  const restSlot = new Map();
  let byTime = 0;

  // ② 압축파일은 파일마다 저장 시각을 갖고 있다. 그 시각이 제각각이면 진짜 시각이라는 뜻이니
  //    가장 가까운 '사진' 자리에 붙인다. 개수가 안 맞아도(못 받은 사진이 있으면 그렇다) 통한다.
  // 내보낼 때 한꺼번에 만들어진 파일이면 시각이 죄다 같다. 그건 진짜 시각이 아니라 쓸 수 없다.
  const stamped = rest.filter(e => e.mdate && e.mtime);
  const spread = new Set(stamped.map(e => e.mdate + e.mtime)).size;
  if (stamped.length && spread >= Math.min(4, stamped.length)) {
    const free = slots.map(m => ({ m, used: false }));
    for (const e of stamped) {
      const t = Date.parse(`${e.mdate}T${e.mtime}:00`);
      let best = null, bestGap = Infinity;
      for (const s of free) {
        if (s.used) continue;
        const gap = Math.abs(s.m.ts - t);
        if (gap < bestGap) { bestGap = gap; best = s; }
      }
      if (best && bestGap <= 30 * 60 * 1000) {
        best.used = true;
        restSlot.set(e.name, best.m);
        byTime++;
      }
    }
  }

  // ③ 그래도 안 되면, 남은 개수가 '사진' 자리 수와 정확히 같을 때만 순서대로 짝짓는다.
  const byOrder = byTime === 0 && rest.length > 0 && rest.length === slots.length;
  if (byOrder) rest.forEach((e, i) => restSlot.set(e.name, slots[i]));

  // 합치면서 메시지 번호가 다시 매겨진다. 짝지을 때 쓴 번호는 합치기 전 것이라
  // 그대로 쓰면 엉뚱한 자리에 붙는다. 내용으로 방 안의 실제 번호를 다시 찾는다.
  const idxOf = new Map(r.messages.map(m => [msgKey(m), m.i]));
  const realIndex = m => (m ? idxOf.get(msgKey(m)) : undefined);

  for (let i = 0; i < media.length; i++) {
    const e = media[i];
    if (kindOf(e.name) === "video" && e.size > VIDEO_MAX) { skipped++; continue; }
    if (i % 20 === 0) busyNote(`사진·동영상 ${i + 1}/${media.length}개 넣는 중…`);
    try {
      const bytes = await zipRead(buf, e);
      const short = e.name.split("/").pop();
      const slot = owner.get(short.toLowerCase()) || restSlot.get(e.name) || null;
      const mi = realIndex(slot);
      const ok = await mediaPut({
        id: `${r.id}|${short}`, roomId: r.id, name: short,
        // 짝이 맞으면 그 메시지의 날짜·시각을, 아니면 이름이나 압축파일에 적힌 날짜를 쓴다
        date: slot ? slot.date : (dateInName(short) || e.mdate),
        time: slot ? slot.time : e.mtime,
        mi: mi === undefined ? null : mi,
        user: slot ? slot.user : "",
        kind: kindOf(short),
        blob: new Blob([bytes], { type: MIME[extOf(short)] }),
      });
      if (ok) { saved++; if (mi !== undefined) attached++; } else skipped++;
    } catch (_) { skipped++; }
  }
  r.media = await mediaOf(r.id);
  // 짝이 안 맞았을 때 무엇을 봐야 할지 알 수 있게 근거를 남긴다
  r.mediaDiag = {
    파일: media.length, 사진자리: slots.length,
    이름으로: owner.size, 시각으로: byTime, 순서로: byOrder ? rest.length : 0,
    제자리에붙음: attached,
    시각있는파일: media.filter(e => e.mdate).length,
    서로다른시각: new Set(media.map(e => e.mdate + e.mtime)).size,
    파일이름예시: media.slice(0, 3).map(e => e.name.split("/").pop()),
    사진자리예시: slots.slice(0, 3).map(m => `${m.date} ${m.time} ${m.user}: ${m.text.slice(0, 20)}`),
  };
  dbPut(r);   // 근거는 새로고침 뒤에도 남아 있어야 쓸모가 있다
  return {
    name: parsed.name, msgs: parsed.messages.length,
    saved, skipped, attached, total: media.length,
    slots: slots.length, named: owner.size, byTime, byOrder,
  };
}

async function handleFiles(fileList) {
  const files = [...fileList].filter(f => /\.(txt|csv|zip)$/i.test(f.name));
  if (!files.length) { toast("카카오톡에서 내보낸 .txt 또는 .zip 파일을 넣어주세요"); return; }

  for (const f of files) {
    if (/\.zip$/i.test(f.name)) {
      // 사진까지 든 압축파일은 오래 걸린다. 진행 상황을 알려준다.
      S.busy = "zip"; S.busyNote = `'${f.name}' 여는 중…`; render();
      try {
        const res = await handleZip(f);
        toast(`'${res.name}' — 대화 ${res.msgs.toLocaleString()}건, ` +
          `사진·동영상 ${res.saved.toLocaleString()}개를 넣었어요.` +
          (res.skipped ? ` ${res.skipped}개는 너무 크거나 지원하지 않아 건너뛰었어요.` : "") +
          (res.attached
            ? `\n그중 ${res.attached}개는 대화 원문의 제자리에 붙였어요` +
              `(${res.named ? "파일 이름" : res.byTime ? "저장 시각" : "순서"}으로 맞춤).` +
              (res.attached < res.saved ? ` 나머지 ${res.saved - res.attached}개는 자료함에만 모였어요.` : "")
            : `\n어느 메시지의 사진인지는 알 수 없어 자료함에만 모았어요. (사진 자리 ${res.slots}개 / 파일 ${res.total}개)` +
              `\n자료함 > 사진 탭의 '사진이 안 붙는 이유 복사'를 눌러 보내주세요.`));
      } catch (err) {
        toast(err.message || "압축파일을 읽지 못했어요");
      } finally {
        S.busy = null; S.busyNote = null;
      }
      continue;
    }
    const raw = decode(await f.arrayBuffer());
    const fallback = f.name.replace(/\.(txt|csv)$/i, "").replace(/^KakaoTalk(Chats)?[_ -]*/i, "");
    const parsed = parseKakao(raw, fallback || "이름 없는 방");
    if (!parsed.messages.length) { toast(`'${f.name}' 에서 대화를 찾지 못했어요`); continue; }
    addRoom(parsed.name, parsed.messages, raw);
  }
  render();
}

// 같은 이름의 방이면 합치고, 같은 메시지는 한 번만 남긴다.
const msgKey = m => `${m.date}|${m.time}|${m.user}|${m.text}`;

// 같은 방인데 이름이 달라 보일 때가 있다. 내보내기 방식에 따라 방 이름 끝에 인원수가
// 붙기도 한다. 이름만 믿고 새 방을 만들면 그 방에 붙여둔 AI 정리가 딸려오지 않는다.
// 그래서 이름이 안 맞으면 내용이 얼마나 겹치는지로 같은 방인지 가린다.
function sameRoomAs(messages) {
  const step = Math.max(1, Math.floor(messages.length / 300));
  const sample = [];
  for (let i = 0; i < messages.length; i += step) {
    const m = messages[i];
    if (!m.sys && m.text.length > 10) sample.push(msgKey(m));
  }
  if (sample.length < 20) return null;

  let best = null, bestHit = 0;
  for (const r of S.rooms) {
    const keys = new Set(r.messages.map(msgKey));
    const hit = sample.reduce((n, k) => n + (keys.has(k) ? 1 : 0), 0);
    if (hit > bestHit) { bestHit = hit; best = r; }
  }
  return bestHit / sample.length >= 0.3 ? best : null;
}

function addRoom(name, messages, raw) {
  let r = S.rooms.find(x => x.name === name);
  let mergedInto = null;
  if (!r) {
    r = sameRoomAs(messages);
    if (r) mergedInto = r.name;
  }
  // 예전 파서로 읽힌 방이면 합치지 않고 통째로 갈아끼운다. 안 그러면 같은 대화가 두 벌 남는다.
  if (r && r.stale) { r.messages = []; r.raws = []; r.stale = false; }
  const hadDates = r ? new Set(r.messages.map(m => m.date)) : null;
  if (r) {
    const seen = new Set(r.messages.map(msgKey));

    // 같은 순간의 사진이 내보내기 방식에 따라 '사진'으로도, 파일 이름으로도 적힌다.
    // 둘을 따로 쌓으면 같은 사진이 두 줄로 보인다. 빈 '사진' 자리를 파일 이름이 물려받게 한다.
    const slotKey = m => `${m.date}|${m.time}|${m.user}`;
    const holes = new Map();
    for (const m of r.messages) {
      if (m.sys || !RE_PLACEHOLDER.test(m.text.trim())) continue;
      if (!holes.has(slotKey(m))) holes.set(slotKey(m), []);
      holes.get(slotKey(m)).push(m);
    }

    const add = [];
    for (const m of messages) {
      if (seen.has(msgKey(m))) continue;
      if (!m.sys && RE_ONE_MEDIA.test(m.text.trim())) {
        const q = holes.get(slotKey(m));
        if (q && q.length) { q.shift().text = m.text; continue; }
      }
      add.push(m);
    }
    r.messages = r.messages.concat(add).sort((a, b) => a.ts - b.ts || a.i - b.i);
    r.messages.forEach((m, i) => (m.i = i));
    toast(mergedInto
      ? `이름이 '${name}'으로 달라졌지만 같은 방이라 '${mergedInto}'에 합쳤어요. ` +
        `${add.length.toLocaleString()}건을 더했고 만들어둔 AI 정리는 그대로예요.`
      : `'${name}' 에 ${add.length.toLocaleString()}건을 더했어요`);
  } else {
    r = { id: "r" + Date.now() + Math.random().toString(36).slice(2, 6), name, messages, raws: [] };
    S.rooms.push(r);
    toast(`'${name}' — ${messages.length.toLocaleString()}건을 불러왔어요`);
  }
  // 원본을 함께 남긴다. 파서를 고쳤을 때 다시 불러올 필요 없이 스스로 다시 읽는다.
  if (raw) (r.raws = r.raws || []).push(raw);
  // 다시 내보내 넣었을 때 어디부터가 새로 들어온 대화인지 표시해 둔다.
  // 처음 불러오는 방은 전부가 새것이므로 표시하지 않는다.
  if (hadDates && hadDates.size) {
    const added = [...new Set(r.messages.map(m => m.date))].filter(x => !hadDates.has(x)).sort();
    r.newFrom = added.length ? added[0] : r.newFrom;
  }
  analyze(r);
  dbPut(r);
  S.roomId = r.id;
  S.date = r.days.length ? r.days[0].date : null;
  S.topicId = null;
  return r;
}

(async function boot() {
  loadAI();
  try {
    const v = JSON.parse(localStorage.getItem(VIEW_STORE) || "{}") || {};
    S.roomState = v.rooms || {};
    S.lastRoom = v.last || null;
  } catch (_) {}
  for (const rec of await sumGetAll()) S.sums[rec.id] = rec;
  const saved = await dbAll();
  for (const rec of saved) {
    let messages = rec.messages;
    // 파서가 바뀐 뒤라면 저장해둔 원본으로 다시 읽는다.
    // 안 그러면 예전 파서가 남긴 흠(입·퇴장 줄이 앞 메시지에 붙는 등)이 그대로 남는다.
    if (rec.pv !== PARSER_VERSION && rec.raws && rec.raws.length) {
      const seen = new Set();
      messages = [];
      for (const raw of rec.raws) {
        for (const m of parseKakao(raw, rec.name).messages) {
          const k = `${m.date}|${m.time}|${m.user}|${m.text}`;
          if (seen.has(k)) continue;
          seen.add(k);
          messages.push(m);
        }
      }
      messages.sort((a, b) => a.ts - b.ts || a.i - b.i).forEach((m, i) => (m.i = i));
    }
    const r = { id: rec.id, name: rec.name, messages, raws: rec.raws || [],
                newFrom: rec.newFrom || null, mediaDiag: rec.mediaDiag || null };
    // 원본 없이 예전 파서로 저장된 방은 스스로 고칠 수 없다. 같은 파일을 다시 넣어야 한다.
    r.stale = rec.pv !== PARSER_VERSION && !r.raws.length;
    analyze(r);
    r.media = await mediaOf(r.id);
    S.rooms.push(r);
    if (rec.pv !== PARSER_VERSION && !r.stale) dbPut(r);
  }
  if (S.rooms.some(r => r.stale)) {
    setTimeout(() => toast("정리 규칙이 바뀌었어요. 같은 .txt를 다시 넣으면 새 규칙으로 읽어요."), 600);
  }
  if (S.rooms.length) {
    // 마지막에 보던 방으로 돌아가고, 그 방에서 보던 탭과 자리까지 되살린다
    goRoom(S.rooms.some(r => r.id === S.lastRoom) ? S.lastRoom : S.rooms[0].id);
  }
  render();
})();
</script>
