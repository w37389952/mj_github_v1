name: 신상 음식점 수집 및 배포

on:
  schedule:
    # 원본이 매일 22:17~22:48(KST)에 갱신되므로 그 42분 뒤인 23:30(KST)에 돈다.
    # 근거는 docs/data-source-findings.md의 '원본 갱신 시각' 절 참고.
    # 23:30 KST = 14:30 UTC. 정각은 GitHub 작업이 몰려 밀리므로 피한다.
    - cron: "30 14 * * *"
  workflow_dispatch:

# 화면만 고쳤을 때는 30분짜리 전량 스캔을 돌릴 이유가 없다.
# 그런 변경은 deploy.yml이 1분 안에 배포한다.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          WINDOW_DAYS: ${{ vars.WINDOW_DAYS || '90' }}
          DISTRICTS: ${{ vars.DISTRICTS }}
          UPTAE: ${{ vars.UPTAE }}
          EXCLUDE: ${{ vars.EXCLUDE }}
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_LOOKUP_BUDGET: ${{ vars.NAVER_LOOKUP_BUDGET || '300' }}
        run: python scripts/collect.py

      - name: 블로그 수집
        env:
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          MY_BLOG_IDS: ${{ vars.MY_BLOG_IDS || 'haranalice' }}
          BLOG_WINDOW_DAYS: ${{ vars.BLOG_WINDOW_DAYS || '14' }}
        run: |
          if [ -z "$NAVER_API_KEY_ID" ]; then
            echo "네이버 인증키 미설정 — 블로그 수집을 건너뜁니다."
            exit 0
          fi
          python scripts/collect_blog.py

      - name: 키워드 경쟁도 수집
        env:
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          KEYWORD_LIMIT: ${{ vars.KEYWORD_LIMIT || '900' }}
        run: |
          if [ -z "$NAVER_API_KEY_ID" ]; then
            echo "네이버 인증키 미설정 — 키워드 수집을 건너뜁니다."
            exit 0
          fi
          python scripts/collect_keywords.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "데이터 갱신: $(date -u +%Y-%m-%d)"
          # 수집에 30분이 걸리므로 그 사이 main이 움직였을 수 있다.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 실패 — 재시도 $i"
            sleep 5
          done
          echo "커밋 푸시에 실패했지만 배포는 계속합니다."

      - uses: actions/configure-pages@v5

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
