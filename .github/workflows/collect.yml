name: 신상 음식점 수집 및 배포

on:
  schedule:
    # 매일 오전 9시 (KST) = 00:00 UTC
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          WINDOW_DAYS: ${{ vars.WINDOW_DAYS || '90' }}
          DISTRICTS: ${{ vars.DISTRICTS }}
          UPTAE: ${{ vars.UPTAE }}
        run: python scripts/collect.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "데이터 갱신: $(date -u +%Y-%m-%d)"
          # 수집에 30분이 걸리므로 그 사이 main이 움직였을 수 있다.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 실패 — 재시도 $i"
            sleep 5
          done
          echo "커밋 푸시에 실패했지만 배포는 계속합니다."

      - uses: actions/configure-pages@v5

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
