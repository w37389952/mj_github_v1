<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울 신상 레이더 — 신규 음식점 대시보드</title>
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --ink: #2d2419;
    --ink-soft: #6f6252;
    --ink-faint: #a3968a;
    --accent: #8a5a2b;
    --accent-soft: #f0e4d6;
    --line: #e8dfd3;
    --badge-rest: #e7f0e4;
    --badge-rest-ink: #3f6b34;
    --badge-general: #e9e7f5;
    --badge-general-ink: #4f4691;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1712;
      --surface: #262019;
      --ink: #f0e8dd;
      --ink-soft: #b5a794;
      --ink-faint: #7d7163;
      --accent: #d9a469;
      --accent-soft: #3a2e20;
      --line: #3a3128;
      --badge-rest: #2c3a28;
      --badge-rest-ink: #a4cf97;
      --badge-general: #2e2b42;
      --badge-general-ink: #b3aae6;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }

  header .eyebrow {
    font-size: 13px; letter-spacing: .12em; color: var(--accent);
    font-weight: 700; text-transform: uppercase;
  }
  header h1 { font-size: 28px; margin-top: 4px; letter-spacing: -0.02em; }
  header .period { color: var(--ink-soft); margin-top: 6px; font-size: 15px; }
  header .updated { color: var(--ink-faint); font-size: 13px; margin-top: 2px; }

  .sample-banner {
    margin-top: 16px; padding: 10px 14px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13.5px; display: none;
  }
  .sample-banner.show { display: block; }

  .stats { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  .stat {
    flex: 1 1 140px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 18px;
  }
  .stat .num { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .stat .label { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  .controls { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
  .controls input, .controls select {
    font: inherit; font-size: 14.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; outline: none;
  }
  .controls input:focus, .controls select:focus { border-color: var(--accent); }
  .controls input { flex: 1 1 200px; }

  .result-count {
    margin-top: 18px; font-size: 13.5px; color: var(--ink-soft); font-weight: 600;
  }
  .result-count:empty { display: none; }

  .day-group { margin-top: 30px; }
  .day-group h2 {
    font-size: 15px; color: var(--ink-soft); font-weight: 700;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 8px;
  }
  .day-group h2 .count { font-weight: 500; color: var(--ink-faint); font-size: 13px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px; margin-top: 12px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  }
  .card .name { font-weight: 700; font-size: 16.5px; letter-spacing: -0.01em; }
  .card .addr { color: var(--ink-soft); font-size: 14px; margin-top: 3px; }
  .card .detail { color: var(--ink-faint); font-size: 13px; margin-top: 3px; }
  .card .detail:empty { display: none; }
  .card .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  }
  .badge.rest { background: var(--badge-rest); color: var(--badge-rest-ink); }
  .badge.general { background: var(--badge-general); color: var(--badge-general-ink); }
  .badge.plain { background: var(--accent-soft); color: var(--accent); }
  .badge.new { background: var(--accent); color: var(--bg); letter-spacing: .04em; }
  .card.is-new { border-color: var(--accent); }
  .card .map-link {
    flex-shrink: 0; font-size: 13px; text-decoration: none; color: var(--accent);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    white-space: nowrap;
  }
  .card .map-link:hover { background: var(--accent-soft); }

  .empty {
    margin-top: 40px; text-align: center; color: var(--ink-faint); font-size: 15px;
    display: none;
  }
  .empty.show { display: block; }

  footer {
    margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-faint);
  }
  footer p + p { margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">SEOUL NEW OPENINGS</div>
    <h1>서울 신상 레이더 🍽️</h1>
    <div class="period" id="period"></div>
    <div class="updated" id="updated"></div>
    <div class="sample-banner" id="sampleBanner">
      ⚠️ 지금 보고 있는 것은 샘플 데이터입니다. 수집 파이프라인이 연결되면 실제 인허가 데이터로 교체됩니다.
    </div>
  </header>

  <div class="stats">
    <div class="stat" id="statNewBox" hidden>
      <div class="num" id="statNew" style="color:var(--accent)">–</div>
      <div class="label">이번 갱신에 추가</div>
    </div>
    <div class="stat"><div class="num" id="statTotal">–</div><div class="label">신규 음식점</div></div>
    <div class="stat"><div class="num" id="statDistricts">–</div><div class="label">지역(구)</div></div>
    <div class="stat"><div class="num" id="statRest">–</div><div class="label">휴게음식점</div></div>
    <div class="stat"><div class="num" id="statGeneral">–</div><div class="label">일반음식점</div></div>
  </div>

  <div class="controls">
    <input type="search" id="search" placeholder="상호명 · 주소 검색">
    <select id="districtFilter"><option value="">전체 지역</option></select>
    <select id="bizTypeFilter"><option value="">전체 업종</option></select>
    <select id="categoryFilter">
      <option value="">전체 구분</option>
      <option value="휴게음식점">휴게음식점</option>
      <option value="일반음식점">일반음식점</option>
    </select>
  </div>

  <div class="result-count" id="resultCount"></div>
  <main id="list"></main>
  <div class="empty" id="empty">조건에 맞는 곳이 없어요.</div>

  <footer>
    <p>데이터 출처: 서울 열린데이터광장 — 휴게음식점(LOCALDATA_072405) · 일반음식점(LOCALDATA_072404) 신규 인허가 기준</p>
    <p>인허가일자는 신고 기준이며, 실제 오픈일과는 며칠~몇 주 차이가 있을 수 있습니다.</p>
  </footer>
</div>

<script>
const FALLBACK_DATA = null; // fetch 실패 시 안내만 표시

let allPlaces = [];

const $ = id => document.getElementById(id);
const fmtDate = iso => {
  const d = new Date(iso + "T00:00:00");
  const days = ["일","월","화","수","목","금","토"];
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
};

// 면적은 제곱미터로 들어온다. 평수가 더 직관적이라 함께 보여준다.
function detailLine(place) {
  const bits = [];
  const area = parseFloat(place.area);
  if (area > 0) {
    bits.push(`${area.toLocaleString("ko-KR")}㎡ (약 ${Math.round(area / 3.3058)}평)`);
  }
  if (place.phone) bits.push(place.phone);
  return bits.join("  ·  ");
}

function naverMapUrl(place) {
  return "https://map.naver.com/p/search/" + encodeURIComponent(place.name + " " + place.address);
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const district = $("districtFilter").value;
  const bizType = $("bizTypeFilter").value;
  const category = $("categoryFilter").value;

  const filtered = allPlaces.filter(c =>
    (!q || c.name.toLowerCase().includes(q) || c.address.toLowerCase().includes(q)) &&
    (!district || c.district === district) &&
    (!bizType || c.bizType === bizType) &&
    (!category || c.category === category)
  );

  $("resultCount").textContent =
    filtered.length === allPlaces.length ? "" : `${filtered.length}곳`;

  const byDate = {};
  filtered.forEach(c => (byDate[c.licenseDate] = byDate[c.licenseDate] || []).push(c));
  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));

  const list = $("list");
  list.innerHTML = "";
  dates.forEach(date => {
    const group = document.createElement("section");
    group.className = "day-group";
    group.innerHTML = `<h2>${fmtDate(date)} 인허가 <span class="count">${byDate[date].length}곳</span></h2>`;
    byDate[date].forEach(c => {
      const badgeClass = c.category === "휴게음식점" ? "rest" : "general";
      const card = document.createElement("article");
      card.className = "card" + (c.isNew ? " is-new" : "");
      card.innerHTML = `
        <div>
          <div class="name"></div>
          <div class="addr"></div>
          <div class="detail"></div>
          <div class="meta">
            ${c.isNew ? `<span class="badge new">NEW</span>` : ""}
            <span class="badge ${badgeClass}">${c.category}</span>
            ${c.bizType ? `<span class="badge plain"></span>` : ""}
            <span class="badge plain district-badge"></span>
          </div>
        </div>
        <a class="map-link" target="_blank" rel="noopener">지도 보기 →</a>`;
      card.querySelector(".name").textContent = c.name;
      card.querySelector(".addr").textContent = c.address;
      card.querySelector(".detail").textContent = detailLine(c);
      if (c.bizType) card.querySelector(".meta .plain").textContent = c.bizType;
      card.querySelector(".district-badge").textContent = c.district;
      card.querySelector(".map-link").href = naverMapUrl(c);
      group.appendChild(card);
    });
    list.appendChild(group);
  });

  $("empty").classList.toggle("show", filtered.length === 0);
}

function init(data) {
  allPlaces = data.places || data.cafes || [];

  if (data.period) {
    $("period").textContent = `최근 신규 인허가 · ${data.period.from} ~ ${data.period.to}`;
  }
  if (data.generatedAt) {
    const d = new Date(data.generatedAt);
    $("updated").textContent = `마지막 업데이트: ${d.toLocaleString("ko-KR")}`;
  }
  if (data.source === "sample") $("sampleBanner").classList.add("show");

  if (data.newCount > 0) {
    $("statNew").textContent = data.newCount;
    $("statNewBox").hidden = false;
  }
  $("statTotal").textContent = allPlaces.length;
  $("statDistricts").textContent = new Set(allPlaces.map(c => c.district)).size;
  $("statRest").textContent = allPlaces.filter(c => c.category === "휴게음식점").length;
  $("statGeneral").textContent = allPlaces.filter(c => c.category === "일반음식점").length;

  const districts = [...new Set(allPlaces.map(c => c.district))]
    .filter(Boolean)
    .sort((a, b) => a.localeCompare(b, "ko"));
  districts.forEach(d => {
    const opt = document.createElement("option");
    opt.value = opt.textContent = d;
    $("districtFilter").appendChild(opt);
  });

  // 업종은 종류가 많으므로 건수가 많은 순으로 정렬하고 개수를 함께 보여준다.
  const bizCounts = new Map();
  allPlaces.forEach(c => bizCounts.set(c.bizType, (bizCounts.get(c.bizType) || 0) + 1));
  [...bizCounts.entries()]
    .filter(([name]) => name)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"))
    .forEach(([name, count]) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = `${name} (${count})`;
      $("bizTypeFilter").appendChild(opt);
    });

  ["search", "districtFilter", "bizTypeFilter", "categoryFilter"].forEach(id =>
    $(id).addEventListener("input", render)
  );
  render();
}

fetch("data/latest.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(init)
  .catch(() => {
    $("period").textContent = "데이터를 불러오지 못했습니다. (data/latest.json 확인 필요)";
  });
</script>
</body>
</html>
