<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울 신상 레이더 — 신규 음식점 대시보드</title>
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --ink: #2d2419;
    --ink-soft: #6f6252;
    --ink-faint: #a3968a;
    --accent: #8a5a2b;
    --accent-soft: #f0e4d6;
    --line: #e8dfd3;
    --badge-rest: #e7f0e4;
    --badge-rest-ink: #3f6b34;
    --badge-general: #e9e7f5;
    --badge-general-ink: #4f4691;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1712;
      --surface: #262019;
      --ink: #f0e8dd;
      --ink-soft: #b5a794;
      --ink-faint: #7d7163;
      --accent: #d9a469;
      --accent-soft: #3a2e20;
      --line: #3a3128;
      --badge-rest: #2c3a28;
      --badge-rest-ink: #a4cf97;
      --badge-general: #2e2b42;
      --badge-general-ink: #b3aae6;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }

  header .eyebrow {
    font-size: 13px; letter-spacing: .12em; color: var(--accent);
    font-weight: 700; text-transform: uppercase;
  }
  header h1 { font-size: 28px; margin-top: 4px; letter-spacing: -0.02em; }
  header .period { color: var(--ink-soft); margin-top: 6px; font-size: 15px; }
  header .updated { color: var(--ink-faint); font-size: 13px; margin-top: 2px; }

  .sample-banner {
    margin-top: 16px; padding: 10px 14px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13.5px; display: none;
  }
  .sample-banner.show { display: block; }

  .tabs {
    display: flex; gap: 6px; margin-top: 22px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    color: var(--ink-soft); background: none; border: none;
    padding: 10px 14px; border-bottom: 2px solid transparent;
    margin-bottom: -1px; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .dot {
    background: var(--accent); color: var(--bg);
    font-size: 11px; font-weight: 700; border-radius: 999px;
    padding: 1px 7px; min-width: 20px; text-align: center;
  }
  .tab .dot[hidden] { display: none; }
  .tab-hint {
    font-size: 12.5px; color: var(--ink-faint); margin-top: 8px;
  }

  .stats-toggle {
    display: block; margin: 8px 0 0 auto; padding: 2px;
    font: inherit; font-size: 12.5px; cursor: pointer;
    color: var(--ink-faint); background: none; border: none;
  }
  .stats-toggle .caret { font-size: 10px; }
  .stats-toggle:hover { color: var(--accent); }

  .stats { display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
  .stats[hidden] { display: none; }
  .stat {
    flex: 1 1 130px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 18px;
  }
  .stat .num { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .stat .label { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  /* 좁은 화면에서는 요약이 스크롤을 잡아먹지 않도록 한 줄로 눌러 담는다. */
  @media (max-width: 620px) {
    .stats { gap: 8px; flex-wrap: nowrap; }
    .stat { flex: 1 1 0; min-width: 0; padding: 9px 10px; }
    .stat .num { font-size: 18px; }
    .stat .label {
      font-size: 11px; margin-top: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .seen-btn { font-size: 11px; padding-top: 2px; }
  }
  .seen-btn {
    font: inherit; font-size: 12px; cursor: pointer; color: var(--accent);
    background: none; border: none; padding: 4px 0 0; text-decoration: underline;
  }

  /* ---- 필터 ---- */
  .controls { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .control-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .field {
    font: inherit; font-size: 14.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; outline: none;
  }
  .field:focus { border-color: var(--accent); }
  input.field[type="search"] { flex: 1 1 100%; }

  .multi { position: relative; }
  .multi-btn {
    font: inherit; font-size: 14.5px; cursor: pointer; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; display: flex; gap: 6px; align-items: center;
  }
  .multi-btn:hover { border-color: var(--accent); }
  .multi-btn.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .multi-btn .caret { font-size: 10px; opacity: .6; }
  .multi-panel {
    position: absolute; z-index: 20; top: calc(100% + 6px); left: 0;
    min-width: 230px; max-height: 320px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.14);
  }
  .multi-panel[hidden] { display: none; }
  .multi-panel label {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 7px; font-size: 14px; cursor: pointer;
  }
  .multi-panel label:hover { background: var(--accent-soft); }
  .multi-panel .cnt { margin-left: auto; color: var(--ink-faint); font-size: 12.5px; }
  .multi-clear {
    width: 100%; font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: none; color: var(--accent); padding: 6px;
    border-top: 1px solid var(--line); margin-top: 4px; text-align: left;
  }

  .range-row { display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
  .range-row.show { display: flex; }
  .range-row .sep { color: var(--ink-faint); }

  .reset-btn {
    font: inherit; font-size: 13.5px; cursor: pointer; color: var(--ink-soft);
    background: none; border: none; text-decoration: underline; padding: 4px;
  }

  .result-count {
    margin-top: 18px; font-size: 13.5px; color: var(--ink-soft); font-weight: 600;
  }
  .result-count:empty { display: none; }

  .day-group { margin-top: 30px; }
  .day-group h2 {
    font-size: 15px; color: var(--ink-soft); font-weight: 700;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 8px;
  }
  .day-group h2 .count { font-weight: 500; color: var(--ink-faint); font-size: 13px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px; margin-top: 12px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  }
  .card.is-new { border-color: var(--accent); }
  .card .name { font-weight: 700; font-size: 16.5px; letter-spacing: -0.01em; }
  .card .addr { color: var(--ink-soft); font-size: 14px; margin-top: 3px; }
  .card .detail { color: var(--ink-faint); font-size: 13px; margin-top: 3px; }
  .card .detail:empty { display: none; }
  .card .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .badge.rest { background: var(--badge-rest); color: var(--badge-rest-ink); }
  .badge.general { background: var(--badge-general); color: var(--badge-general-ink); }
  .badge.plain { background: var(--accent-soft); color: var(--accent); }
  .badge.new { background: var(--accent); color: var(--bg); letter-spacing: .04em; }
  .card .map-link {
    flex-shrink: 0; font-size: 13px; text-decoration: none; color: var(--accent);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    white-space: nowrap;
  }
  .card .map-link:hover { background: var(--accent-soft); }
  .card .actions {
    flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; align-items: stretch;
  }

  .copy-btn {
    font: inherit; font-size: 12px; line-height: 1; cursor: pointer;
    background: none; border: none; padding: 3px 5px; border-radius: 6px;
    color: var(--ink-faint); opacity: .65;
  }
  .copy-btn:hover { opacity: 1; background: var(--accent-soft); }
  .copy-btn.done { opacity: 1; color: var(--accent); }
  .name-copy { margin-left: 6px; vertical-align: middle; }

  .insta { position: relative; }
  .insta-btn {
    font: inherit; width: 100%; cursor: pointer; background: var(--surface);
    display: flex; justify-content: center; gap: 4px; align-items: center;
  }
  .insta-panel {
    position: absolute; z-index: 30; right: 0; top: calc(100% + 6px);
    min-width: 210px; max-width: 280px; max-height: 340px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.16);
  }
  .insta-panel[hidden] { display: none; }
  .insta-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 4px 2px 5px; border-radius: 7px;
  }
  .insta-row:hover { background: var(--accent-soft); }
  .insta-row a {
    flex: 1; min-width: 0; padding: 5px 0; font-size: 13.5px;
    color: var(--ink); text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .insta-row:hover a { color: var(--accent); }
  .insta-row .note {
    flex-shrink: 0; font-size: 10.5px; color: var(--ink-faint);
  }
  .insta-note {
    font-size: 11.5px; color: var(--ink-faint); padding: 6px 9px 2px;
    border-top: 1px solid var(--line); margin-top: 4px;
  }

  .pager {
    display: flex; gap: 6px; justify-content: center; align-items: center;
    margin-top: 28px; flex-wrap: wrap;
  }
  .pager[hidden] { display: none; }
  .pager button {
    font: inherit; font-size: 14px; cursor: pointer; min-width: 38px;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pager button[aria-current="page"] {
    background: var(--accent); border-color: var(--accent);
    color: var(--bg); font-weight: 700;
  }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager .gap { color: var(--ink-faint); padding: 0 2px; }

  .empty {
    margin-top: 40px; text-align: center; color: var(--ink-faint); font-size: 15px;
    display: none;
  }
  .empty.show { display: block; }

  footer {
    margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-faint);
  }
  footer p + p { margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">SEOUL NEW OPENINGS</div>
    <h1>서울 신상 레이더 🍽️</h1>
    <div class="period" id="period"></div>
    <div class="updated" id="updated"></div>
    <div class="sample-banner" id="sampleBanner">
      ⚠️ 지금 보고 있는 것은 샘플 데이터입니다. 수집 파이프라인이 연결되면 실제 인허가 데이터로 교체됩니다.
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" id="tabOpened" role="tab" aria-selected="true">
      신규 오픈 <span class="dot" id="dotOpened" hidden></span>
    </button>
    <button type="button" class="tab" id="tabChanged" role="tab" aria-selected="false">
      간판 교체 <span class="dot" id="dotChanged" hidden></span>
    </button>
  </div>
  <div class="tab-hint" id="tabHint"></div>

  <button type="button" class="stats-toggle" id="statsToggle" aria-expanded="true">
    <span id="statsToggleText">요약 숨기기</span> <span class="caret">▴</span>
  </button>
  <div class="stats" id="stats">
    <div class="stat" id="statNewBox" hidden>
      <div class="num" id="statNew" style="color:var(--accent)">–</div>
      <div class="label" id="statNewLabel">새로 추가</div>
      <button type="button" class="seen-btn" id="markSeenBtn"
              title="목록은 그대로 두고 NEW 표시만 지웁니다">모두 확인함</button>
    </div>
    <div class="stat"><div class="num" id="statTotal">–</div><div class="label">신규 음식점</div></div>
    <div class="stat"><div class="num" id="statDistricts">–</div><div class="label">지역(구)</div></div>
    <div class="stat"><div class="num" id="statBiz">–</div><div class="label">업종</div></div>
  </div>

  <div class="controls">
    <div class="control-row">
      <input type="search" id="search" class="field" placeholder="상호명 · 주소 검색">
    </div>
    <div class="control-row">
      <div class="multi" id="districtMulti"></div>
      <div class="multi" id="bizTypeMulti"></div>
      <select id="categoryFilter" class="field">
        <option value="">전체 구분</option>
        <option value="휴게음식점">휴게음식점</option>
        <option value="일반음식점">일반음식점</option>
      </select>
      <select id="monthFilter" class="field"><option value="">전체 기간</option></select>
      <button type="button" class="multi-btn" id="rangeToggle">기간검색 <span class="caret">▾</span></button>
      <button type="button" class="reset-btn" id="resetBtn">필터 초기화</button>
    </div>
    <div class="control-row range-row" id="rangeRow">
      <input type="date" id="fromDate" class="field">
      <span class="sep">~</span>
      <input type="date" id="toDate" class="field">
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <main id="list"></main>
  <nav class="pager" id="pager" aria-label="페이지"></nav>
  <div class="empty" id="empty">조건에 맞는 곳이 없어요.</div>

  <footer>
    <p>데이터 출처: 서울 열린데이터광장 — 휴게음식점(LOCALDATA_072405) · 일반음식점(LOCALDATA_072404) 신규 인허가 기준</p>
    <p>인허가일자는 신고 기준이며, 실제 오픈일과는 며칠~몇 주 차이가 있을 수 있습니다.</p>
  </footer>
</div>

<script>
const PAGE_SIZE = 100;
const STATS_KEY = "seoul-radar:statsHidden";
const FIRST_VISIT_KEY = "seoul-radar:firstVisit";  // 이 사이트를 처음 쓴 날

// 탭마다 목록도, NEW 판정 기준일도 따로 관리한다.
// '간판 교체' 탭을 한 번도 누르지 않았다면 그 목록은 안 본 것이므로
// 기준일이 움직이지 않고 NEW가 계속 쌓인다.
const TABS = {
  opened: {
    file: "data/latest.json",
    tabId: "tabOpened", dotId: "dotOpened",
    baselineKey: "seoul-radar:baseline", lastDayKey: "seoul-radar:lastDay",
    hint: "최근 90일 안에 새로 인허가가 난 곳입니다.",
    dateField: "licenseDate", dateLabel: "인허가",
    places: null, baseline: null, page: 1,
  },
  changed: {
    file: "data/changed.json",
    tabId: "tabChanged", dotId: "dotChanged",
    baselineKey: "seoul-radar:baseline:changed", lastDayKey: "seoul-radar:lastDay:changed",
    hint: "인허가는 그 전이지만 최근 90일 안에 기록이 바뀐 곳입니다. " +
          "기존 허가를 넘겨받아 상호만 바뀐 경우가 여기 들어옵니다.",
    dateField: "modifiedDate", dateLabel: "정보 변경",
    places: null, baseline: null, page: 1,
  },
};

let activeTab = "opened";
const tab = () => TABS[activeTab];
let today = null;
const selected = { district: new Set(), bizType: new Set() };

const $ = id => document.getElementById(id);

const fmtDate = iso => {
  const d = new Date(iso + "T00:00:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
};

// 주소에 붙은 층·호수·건물명은 지도 검색을 방해하므로 도로명 본문만 남긴다.
//   "서울특별시 마포구 양화로16길 34, 2,3층 (서교동)" → "서울특별시 마포구 양화로16길 34"
function searchableAddress(address) {
  return address.split(",")[0].replace(/\s*\([^)]*\)\s*$/, "").trim();
}

function naverMapUrl(place) {
  return "https://map.naver.com/p/search/" +
    encodeURIComponent(searchableAddress(place.address) || place.address);
}

/* ---------- 인스타 계정 아이디 후보 ----------
 * 인스타그램은 계정 검색 API를 공개하지 않아 '이 가게의 계정'을 자동으로
 * 찾아줄 수 없다. 대신 가게 주인이 지었을 법한 아이디를 여러 갈래로 만들어
 * 복사해 쓰도록 한다. 아이디에는 밑줄과 점을 넣지 않는다.
 */

// 상호에 붙는 업종어. 계정명에는 잘 안 들어가므로 뺀다.
const BIZ_WORDS = [
  "커피숍", "커피", "로스터스", "로스터리", "로스터", "카페", "까페",
  "베이커리", "브레드", "제과점", "제과", "디저트", "티하우스", "찻집",
  "스튜디오", "공방", "키친", "팩토리", "coffee", "cafe", "roasters",
];

// 자주 쓰이는 외래어. 소리대로 옮기면 철자가 어긋나므로 먼저 바꾼다.
const LOANWORDS = {
  "피자": "pizza", "파스타": "pasta", "버거": "burger", "베이글": "bagel",
  "쿠키": "cookie", "케이크": "cake", "와플": "waffle", "도넛": "donut",
  "젤라또": "gelato", "스콘": "scone", "샐러드": "salad", "치킨": "chicken",
  "라멘": "ramen", "누들": "noodle", "푸드": "food", "밀크": "milk",
  "라떼": "latte", "브루어리": "brewery", "하우스": "house", "홈": "home",
  "룸": "room", "숍": "shop", "스토어": "store", "마켓": "market",
  "랩": "lab", "클럽": "club", "플레이스": "place", "스페이스": "space",
  "테이블": "table", "스푼": "spoon", "그린": "green", "블루": "blue",
  "화이트": "white", "블랙": "black", "레드": "red", "핑크": "pink",
  "문": "moon", "스타": "star", "가든": "garden", "포레스트": "forest",
  "레몬": "lemon", "체리": "cherry", "베리": "berry", "피치": "peach",
  "하트": "heart", "허브": "hub", "퍼그": "pug", "베어": "bear",
  "래빗": "rabbit", "버니": "bunny", "폭스": "fox", "데이": "day",
  "모닝": "morning", "슬로우": "slow", "리틀": "little", "드림": "dream",
  "소울": "soul", "굿": "good", "뉴": "new",
};

// 음절을 이루는 자모의 로마자 표기. 첫 값이 국어의 로마자 표기법 기준이고
// 나머지는 사람들이 아이디에 실제로 자주 쓰는 변형이다.
const LEAD_ALT = [
  ["g","k"], ["kk","gg"], ["n"], ["d","t"], ["tt","dd"], ["r","l"], ["m"],
  ["b","p"], ["pp","bb"], ["s"], ["ss"], [""], ["j","z"], ["jj"], ["ch","c"],
  ["k"], ["t"], ["p","f"], ["h"],
];
const VOWEL_ALT = [
  ["a"], ["ae","ai"], ["ya"], ["yae"], ["eo","u","o"], ["e"], ["yeo","yo"],
  ["ye"], ["o","oh"], ["wa"], ["wae"], ["oe","we"], ["yo"], ["u","oo"],
  ["wo","weo"], ["we"], ["wi","ui"], ["yu"], ["eu","u",""], ["ui","i"],
  ["i","ee"],
];
const TAIL_ALT = [
  [""], ["k","g"], ["k"], ["k"], ["n"], ["n"], ["n"], ["t","s"], ["l","r"],
  ["k"], ["m"], ["l"], ["l"], ["l"], ["p"], ["l"], ["m"], ["p","b"], ["p"],
  ["t","s"], ["t"], ["ng"], ["t"], ["t"], ["k"], ["t"], ["p"], ["t"],
];

const MAX_BASES = 6;

/** 한 음절이 어떻게 적힐 수 있는지 후보를 낸다. */
function syllableSpellings(ch) {
  const code = ch.charCodeAt(0) - 0xac00;
  if (code < 0 || code > 11171) {
    const plain = ch.toLowerCase().replace(/[^a-z0-9]/g, "");
    return plain ? [plain] : [];
  }
  const lead = LEAD_ALT[Math.floor(code / 588)];
  const vowel = VOWEL_ALT[Math.floor((code % 588) / 28)];
  const tail = TAIL_ALT[code % 28];
  const out = [];
  lead.forEach(l => vowel.forEach(v => tail.forEach(t => {
    const s = l + v + t;
    if (s && !out.includes(s)) out.push(s);
  })));
  return out;
}

/** 문자열을 여러 철자로 옮긴다. 표준 표기가 항상 첫 번째에 온다. */
function spellVariants(text) {
  let combos = [""];
  for (const ch of text) {
    const options = syllableSpellings(ch);
    if (!options.length) continue;
    combos = combos.flatMap(prefix => options.map(o => prefix + o));
    // 음절마다 갈래가 늘어나므로 그때그때 잘라낸다. 앞쪽이 표준 표기다.
    if (combos.length > MAX_BASES * 4) combos = combos.slice(0, MAX_BASES * 4);
  }
  return [...new Set(combos)].filter(Boolean);
}

/** 상호를 외래어 조각과 한글 조각으로 나눈다. */
function segment(core) {
  const keys = Object.keys(LOANWORDS).sort((a, b) => b.length - a.length);
  const segs = [];
  let buffer = "";
  let i = 0;
  while (i < core.length) {
    const hit = keys.find(k => core.startsWith(k, i));
    if (hit) {
      if (buffer.trim()) segs.push({ ko: buffer.trim() });
      segs.push({ ko: hit, en: LOANWORDS[hit] });
      buffer = "";
      i += hit.length;
    } else {
      buffer += core[i];
      i += 1;
    }
  }
  if (buffer.trim()) segs.push({ ko: buffer.trim() });
  return segs;
}

function baseSpellings(core, english) {
  const perSegment = segment(core).map(seg => {
    const out = [];
    if (seg.en) out.push(seg.en);
    spellVariants(seg.ko).forEach(v => out.includes(v) || out.push(v));
    return out.slice(0, 4);
  }).filter(s => s.length);

  let combos = perSegment.reduce(
    (acc, choices) => acc.flatMap(p => choices.map(c => p + c)).slice(0, MAX_BASES * 4),
    [""]
  );
  combos = combos.filter(Boolean);
  if (english) {
    const e = english.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (e) combos = [e, ...combos.filter(c => c !== e)];
  }
  return [...new Set(combos)].slice(0, MAX_BASES);
}

function hotspotTokens(address) {
  const m = address.match(/\(([^)]*)\)\s*$/);
  const inside = m ? m[1].split(",").map(s => s.trim()) : [];
  for (const name of inside) {
    if (HOTSPOTS[name]) return HOTSPOTS[name];
    // "성수동1가"처럼 뒤에 가지가 붙는 경우
    const base = name.replace(/\d+가$/, "");
    if (HOTSPOTS[base]) return HOTSPOTS[base];
  }
  return [];
}

// 업태값은 docs/data-source-findings.md의 실측 목록을 따른다.
const CAFE_LIKE = new Set([
  "커피숍", "다방", "전통찻집", "떡카페", "과자점", "아이스크림", "까페", "키즈카페",
]);
function isCafeLike(place) {
  return CAFE_LIKE.has(place.bizType) || /카페|커피|베이커리|디저트|로스터/.test(place.name);
}

function stripBizWords(text) {
  let out = text;
  BIZ_WORDS.forEach(w => { out = out.replace(new RegExp(w, "gi"), " "); });
  return out.replace(/\s+/g, " ").trim();
}

/** 계정 아이디 후보. 앞쪽일수록 그럴듯한 순서다. */
function instagramHandles(place) {
  const raw = place.name;
  const paren = raw.match(/[（(]([^）)]+)[）)]/);
  const english = paren && /[A-Za-z]/.test(paren[1]) ? paren[1].trim() : "";

  let core = raw.replace(/[（(][^）)]*[）)]/g, " ");
  core = core.replace(/\s*[^\s]{0,10}(본점|직영점|\d+호점|점)\s*$/, " ");
  core = stripBizWords(core);
  if (!core) core = stripBizWords(raw) || raw;

  const bases = baseSpellings(core, english);
  const hoods = hotspotTokens(place.address);
  const cats = isCafeLike(place) ? ["cafe", "coffee"] : ["room", "eatery"];

  const out = [];
  const push = (handle, note) => {
    if (handle.length < 3 || handle.length > 30) return;
    if (out.some(x => x.handle === handle)) return;
    out.push({ handle, note });
  };

  bases.forEach(b => push(b, ""));
  hoods.forEach(h => bases.slice(0, 2).forEach(b => push(b + h, "지역")));
  cats.forEach(c => bases.slice(0, 2).forEach(b => push(b + c, "업종")));
  if (bases[0]) {
    ["seoul", "kr", "official"].forEach(g => push(bases[0] + g, "기타"));
    if (isCafeLike(place)) push(bases[0] + "kafe", "변형");
  }
  return out.slice(0, 20);
}

// 면적은 제곱미터로 들어온다. 평수가 더 직관적이라 함께 보여준다.
function detailLine(place) {
  const bits = [];
  const area = parseFloat(place.area);
  if (area > 0) {
    bits.push(`${area.toLocaleString("ko-KR")}㎡ (약 ${Math.round(area / 3.3058)}평)`);
  }
  if (place.phone) bits.push(place.phone);
  return bits.join("  ·  ");
}

// 이 방문자가 이 탭을 지난번에 봤을 때는 없었던 건인지.
function isNewToVisitor(place) {
  const base = tab().baseline;
  if (!base || !place.firstSeen) return false;
  return place.firstSeen > base;
}

function store(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* 사생활 보호 모드 등 */ }
}

/** 이 사이트를 처음 쓴 날. 없으면 오늘로 기록한다. */
function siteFirstVisit() {
  let stored;
  try {
    stored = localStorage.getItem(FIRST_VISIT_KEY);
    if (!stored) {
      // 이 키가 생기기 전부터 쓰던 사람은 기존 방문 기록을 물려받는다.
      stored = localStorage.getItem(TABS.opened.lastDayKey) || today;
      store(FIRST_VISIT_KEY, stored);
    }
  } catch (e) {
    return today;
  }
  return stored;
}

/**
 * 이 탭의 NEW 판정 기준일을 정한다. 탭을 실제로 열었을 때만 호출한다.
 *
 * 기준일은 하루에 한 번만 앞으로 움직인다. 오랜만에 들어온 날 새로고침을 하거나
 * 창을 껐다 다시 켜도 그날 안에는 NEW가 그대로 남아 있어야, 미처 다 보지 못한
 * 목록을 놓치지 않는다.
 */
function resolveBaseline(t) {
  let lastDay, stored;
  try {
    lastDay = localStorage.getItem(t.lastDayKey);
    stored = localStorage.getItem(t.baselineKey);
  } catch (e) {
    return null;  // 저장이 막힌 환경에서는 NEW 표시를 포기한다
  }

  if (!lastDay) {
    // 이 탭을 한 번도 연 적이 없다. 사이트를 쓰기 시작한 날을 기준으로 삼는다.
    // 그래야 "사이트는 계속 봤지만 이 탭은 안 눌렀다"면 그동안 쌓인 것이 NEW로 뜬다.
    // 사이트 자체가 첫 방문이면 firstVisit이 오늘이므로 NEW는 뜨지 않는다.
    const base = siteFirstVisit();
    store(t.lastDayKey, today); store(t.baselineKey, base);
    return base;
  }
  if (lastDay === today) return stored;  // 오늘 이미 봤다. 기준 유지.

  // 날이 바뀌었다. 직전 열람일을 새 기준으로 삼는다.
  store(t.lastDayKey, today); store(t.baselineKey, lastDay);
  return lastDay;
}

/** 아직 열지 않은 탭에 몇 건이 쌓였는지. 목록을 받지 않고 집계만으로 센다. */
function pendingCount(t, firstSeenCounts) {
  let base;
  try {
    // 한 번도 안 연 탭이면 사이트를 쓰기 시작한 날이 기준이 된다.
    base = localStorage.getItem(t.lastDayKey)
      ? localStorage.getItem(t.baselineKey)
      : siteFirstVisit();
  } catch (e) { return 0; }
  if (!base) return 0;
  return Object.entries(firstSeenCounts || {})
    .filter(([day]) => day > base)
    .reduce((sum, [, n]) => sum + n, 0);
}

// 사용자가 직접 '다 봤다'고 알릴 때만 기준일을 오늘로 당긴다.
// 목록에서 항목을 지우는 것이 아니라 NEW 표시만 없앤다.
function markAllSeen() {
  const t = tab();
  store(t.baselineKey, today);
  store(t.lastDayKey, today);
  t.baseline = today;
  $("statNewBox").hidden = true;
  render();
}

/* ---------- 다중 선택 드롭다운 ---------- */

function buildMulti(container, field, label, entries) {
  container.innerHTML = `
    <button type="button" class="multi-btn"><span class="txt"></span><span class="caret">▾</span></button>
    <div class="multi-panel" hidden></div>`;
  const btn = container.querySelector(".multi-btn");
  const panel = container.querySelector(".multi-panel");

  entries.forEach(([name, count]) => {
    const row = document.createElement("label");
    row.innerHTML = `<input type="checkbox"><span></span><span class="cnt"></span>`;
    row.querySelector("input").value = name;
    row.querySelector("span").textContent = name;
    row.querySelector(".cnt").textContent = count;
    panel.appendChild(row);
  });

  const clear = document.createElement("button");
  clear.type = "button";
  clear.className = "multi-clear";
  clear.textContent = "선택 해제";
  panel.appendChild(clear);

  const sync = () => {
    const picked = selected[field];
    btn.querySelector(".txt").textContent =
      picked.size === 0 ? label
      : picked.size === 1 ? [...picked][0]
      : `${label.replace("전체 ", "")} ${picked.size}개`;
    btn.classList.toggle("active", picked.size > 0);
    panel.querySelectorAll("input").forEach(i => (i.checked = picked.has(i.value)));
  };

  btn.addEventListener("click", e => {
    e.stopPropagation();
    document.querySelectorAll(".multi-panel").forEach(p => {
      if (p !== panel) p.hidden = true;
    });
    panel.hidden = !panel.hidden;
  });
  panel.addEventListener("click", e => e.stopPropagation());
  panel.addEventListener("change", e => {
    if (e.target.checked) selected[field].add(e.target.value);
    else selected[field].delete(e.target.value);
    sync();
    resetPaging();
  });
  clear.addEventListener("click", () => {
    selected[field].clear();
    sync();
    resetPaging();
  });

  container.sync = sync;
  sync();
}

function buildInstaMenu(card, place) {
  const btn = card.querySelector(".insta-btn");
  const panel = card.querySelector(".insta-panel");

  btn.addEventListener("click", e => {
    e.stopPropagation();
    // 검색어 만들기와 DOM 생성은 실제로 누른 카드에서만 한다.
    // 한 화면에 카드가 100개라 미리 다 만들면 그만큼 무거워진다.
    if (!panel.dataset.built) {
      fillInstaPanel(panel, place);
      panel.dataset.built = "1";
    }
    document.querySelectorAll(".insta-panel").forEach(p => {
      if (p !== panel) p.hidden = true;
    });
    panel.hidden = !panel.hidden;
  });
  panel.addEventListener("click", e => e.stopPropagation());
}

function fillInstaPanel(panel, place) {
  instagramHandles(place).forEach(({ handle, note }) => {
    const row = document.createElement("div");
    row.className = "insta-row";
    row.innerHTML = `
      <a target="_blank" rel="noopener"><span class="q"></span></a>
      <span class="note"></span>`;
    const link = row.querySelector("a");
    link.href = `https://www.instagram.com/${encodeURIComponent(handle)}/`;
    row.querySelector(".q").textContent = handle;
    row.querySelector(".note").textContent = note;
    row.appendChild(copyButton(handle));
    panel.appendChild(row);
  });
  const note = document.createElement("p");
  note.className = "insta-note";
  note.textContent = "누르면 그 계정으로, 📋는 아이디 복사";
  panel.appendChild(note);
}

/** 클립보드에 넣는다. 최신 API가 막히면 예전 방식으로 한 번 더 시도한다. */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) { /* 아래 예전 방식으로 */ }

  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

/** 눌러서 클립보드에 복사하는 버튼. 복사되면 잠깐 표시가 바뀐다. */
function copyButton(text, extraClass = "") {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = `copy-btn ${extraClass}`.trim();
  btn.textContent = "📋";
  btn.title = "복사";
  btn.setAttribute("aria-label", `${text} 복사`);
  btn.addEventListener("click", async e => {
    e.stopPropagation();
    e.preventDefault();
    if (await copyText(text)) {
      btn.textContent = "✓";
      btn.classList.add("done");
    } else {
      btn.textContent = "!";  // 클립보드가 막힌 환경
    }
    setTimeout(() => {
      btn.textContent = "📋";
      btn.classList.remove("done");
    }, 1200);
  });
  return btn;
}

/* ---------- 렌더링 ---------- */

function currentFilters() {
  const q = $("search").value.trim().toLowerCase();
  const month = $("monthFilter").value;
  const from = $("fromDate").value;
  const to = $("toDate").value;
  const category = $("categoryFilter").value;
  return { q, month, from, to, category };
}

function matches(place, f, t) {
  // 날짜 조건은 탭마다 기준이 다르다. 신규 오픈은 인허가일자,
  // 간판 교체는 기록이 바뀐 날짜로 걸러야 말이 된다.
  const day = place[t.dateField] || place.licenseDate;
  if (f.q && !place.name.toLowerCase().includes(f.q) &&
      !place.address.toLowerCase().includes(f.q)) return false;
  if (selected.district.size && !selected.district.has(place.district)) return false;
  if (selected.bizType.size && !selected.bizType.has(place.bizType)) return false;
  if (f.category && place.category !== f.category) return false;
  if (f.month && !day.startsWith(f.month)) return false;
  if (f.from && day < f.from) return false;
  if (f.to && day > f.to) return false;
  return true;
}

function resetPaging() {
  tab().page = 1;
  render();
}

/** 현재 페이지 주변만 번호로 보여주고 사이는 …으로 접는다. */
function pageNumbers(current, total) {
  const nums = new Set([1, total, current, current - 1, current + 1]);
  if (current <= 3) [2, 3, 4].forEach(n => nums.add(n));
  if (current >= total - 2) [total - 1, total - 2, total - 3].forEach(n => nums.add(n));

  const shown = [...nums].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
  const out = [];
  shown.forEach((n, i) => {
    if (i > 0 && n - shown[i - 1] > 1) out.push("gap");
    out.push(n);
  });
  return out;
}

function goToPage(n) {
  tab().page = n;
  render();
  // 페이지를 넘기면 목록 맨 위로 올려준다. 안 그러면 아래쪽에 머문 채 내용만 바뀐다.
  $("list").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderPager(totalItems) {
  const pager = $("pager");
  const currentPage = tab().page;
  const totalPages = Math.ceil(totalItems / PAGE_SIZE);
  pager.innerHTML = "";
  pager.hidden = totalPages <= 1;
  if (pager.hidden) return;

  const button = (label, page, opts = {}) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (opts.current) b.setAttribute("aria-current", "page");
    if (opts.disabled) b.disabled = true;
    else b.addEventListener("click", () => goToPage(page));
    pager.appendChild(b);
  };

  button("‹", currentPage - 1, { disabled: currentPage === 1 });
  pageNumbers(currentPage, totalPages).forEach(n => {
    if (n === "gap") {
      const span = document.createElement("span");
      span.className = "gap";
      span.textContent = "…";
      pager.appendChild(span);
    } else {
      button(String(n), n, { current: n === currentPage });
    }
  });
  button("›", currentPage + 1, { disabled: currentPage === totalPages });
}

function render() {
  const t = tab();
  const allPlaces = t.places || [];
  const f = currentFilters();
  const filtered = allPlaces.filter(p => matches(p, f, t));

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (t.page > totalPages) t.page = totalPages;
  const start = (t.page - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);

  $("resultCount").textContent = filtered.length === 0 ? ""
    : `${filtered.length.toLocaleString("ko-KR")}곳 중 ` +
      `${(start + 1).toLocaleString("ko-KR")}–${(start + page.length).toLocaleString("ko-KR")}`;

  const byDate = {};
  page.forEach(p => {
    const day = p[t.dateField] || p.licenseDate;
    (byDate[day] = byDate[day] || []).push(p);
  });
  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));

  const list = $("list");
  list.innerHTML = "";
  dates.forEach(date => {
    const group = document.createElement("section");
    group.className = "day-group";
    group.innerHTML = `<h2>${fmtDate(date)} ${t.dateLabel} <span class="count">${byDate[date].length}곳</span></h2>`;
    byDate[date].forEach(p => {
      const fresh = isNewToVisitor(p);
      const badgeClass = p.category === "휴게음식점" ? "rest" : "general";
      const card = document.createElement("article");
      card.className = "card" + (fresh ? " is-new" : "");
      card.innerHTML = `
        <div>
          <div class="name"></div>
          <div class="addr"></div>
          <div class="detail"></div>
          <div class="meta">
            ${fresh ? `<span class="badge new">NEW</span>` : ""}
            <span class="badge ${badgeClass}">${p.category}</span>
            ${p.bizType ? `<span class="badge plain biz-badge"></span>` : ""}
            <span class="badge plain district-badge"></span>
          </div>
        </div>
        <div class="actions">
          <a class="map-link" target="_blank" rel="noopener">지도 보기 →</a>
          <div class="insta">
            <button type="button" class="map-link insta-btn">인스타 <span class="caret">▾</span></button>
            <div class="insta-panel" hidden></div>
          </div>
        </div>`;
      card.querySelector(".name").textContent = p.name;
      card.querySelector(".name").appendChild(copyButton(p.name, "name-copy"));
      card.querySelector(".addr").textContent = p.address;
      card.querySelector(".detail").textContent = detailLine(p);
      if (p.bizType) card.querySelector(".biz-badge").textContent = p.bizType;
      card.querySelector(".district-badge").textContent = p.district;
      card.querySelector(".map-link").href = naverMapUrl(p);
      buildInstaMenu(card, p);
      group.appendChild(card);
    });
    list.appendChild(group);
  });

  renderPager(filtered.length);
  $("empty").classList.toggle("show", filtered.length === 0);
}

/* ---------- 초기화 ---------- */

function setStatsHidden(hidden) {
  $("stats").hidden = hidden;
  $("statsToggle").setAttribute("aria-expanded", String(!hidden));
  $("statsToggleText").textContent = hidden ? "요약 보기" : "요약 숨기기";
  $("statsToggle").querySelector(".caret").textContent = hidden ? "▾" : "▴";
}

function countBy(places, key) {
  const counts = new Map();
  places.forEach(p => p[key] && counts.set(p[key], (counts.get(p[key]) || 0) + 1));
  return counts;
}

/** 활성 탭의 목록에 맞춰 통계·필터 선택지를 다시 채운다. */
function refreshForTab() {
  const t = tab();
  const places = t.places || [];

  $("tabHint").textContent = t.hint;
  Object.entries(TABS).forEach(([key, other]) =>
    $(other.tabId).setAttribute("aria-selected", String(key === activeTab))
  );

  const freshCount = places.filter(isNewToVisitor).length;
  $("statNewBox").hidden = freshCount === 0;
  $("statNew").textContent = freshCount > 0 ? freshCount.toLocaleString("ko-KR") : "–";
  $("statNewLabel").textContent =
    freshCount > 0 ? `${t.baseline} 이후 새로 추가` : "새로 추가";
  $("statTotal").textContent = places.length.toLocaleString("ko-KR");
  $("statDistricts").textContent = countBy(places, "district").size;
  $("statBiz").textContent = countBy(places, "bizType").size;

  buildMulti(
    $("districtMulti"), "district", "전체 지역",
    [...countBy(places, "district").entries()].sort((a, b) => a[0].localeCompare(b[0], "ko"))
  );
  buildMulti(
    $("bizTypeMulti"), "bizType", "전체 업종",
    [...countBy(places, "bizType").entries()]
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"))
  );

  // 데이터에 실제로 존재하는 달만 목록에 넣는다.
  const monthSel = $("monthFilter");
  const keepMonth = monthSel.value;
  monthSel.innerHTML = `<option value="">전체 기간</option>`;
  [...new Set(places.map(p => (p[t.dateField] || p.licenseDate).slice(0, 7)))]
    .filter(Boolean)
    .sort((a, b) => b.localeCompare(a))
    .forEach(ym => {
      const opt = document.createElement("option");
      opt.value = ym;
      opt.textContent = `${ym.slice(0, 4)}년 ${Number(ym.slice(5, 7))}월`;
      monthSel.appendChild(opt);
    });
  monthSel.value = [...monthSel.options].some(o => o.value === keepMonth) ? keepMonth : "";

  render();
}

/** 탭을 연다. 이때 비로소 그 탭의 NEW 기준일이 갱신된다. */
async function openTab(key) {
  activeTab = key;
  const t = tab();
  if (!t.places) {
    try {
      const res = await fetch(t.file);
      if (!res.ok) throw new Error(res.status);
      t.places = (await res.json()).places || [];
    } catch (e) {
      t.places = [];
      $("tabHint").textContent = "이 목록을 불러오지 못했습니다.";
    }
  }
  // 목록을 실제로 화면에 띄우는 시점에 기준일을 옮긴다.
  if (t.baseline === null) t.baseline = resolveBaseline(t);
  $(t.dotId).hidden = true;
  t.page = 1;
  refreshForTab();
}

function init(data) {
  today = new Date().toLocaleDateString("sv-SE");  // 현지 시간 기준 YYYY-MM-DD
  TABS.opened.places = data.places || data.cafes || [];

  if (data.period) {
    $("period").textContent = `최근 90일 · ${data.period.from} ~ ${data.period.to}`;
  }
  if (data.generatedAt) {
    $("updated").textContent =
      `마지막 업데이트: ${new Date(data.generatedAt).toLocaleString("ko-KR")}`;
  }
  if (data.source === "sample") $("sampleBanner").classList.add("show");

  // 아직 열지 않은 '간판 교체' 탭에 몇 건이 쌓였는지 뱃지로 알린다.
  const pending = pendingCount(TABS.changed, data.changedFirstSeen);
  if (pending > 0) {
    $("dotChanged").textContent = pending.toLocaleString("ko-KR");
    $("dotChanged").hidden = false;
  }

  Object.entries(TABS).forEach(([key, t]) =>
    $(t.tabId).addEventListener("click", () => { if (activeTab !== key) openTab(key); })
  );
  $("markSeenBtn").addEventListener("click", markAllSeen);

  $("search").addEventListener("input", resetPaging);
  $("categoryFilter").addEventListener("input", resetPaging);
  $("monthFilter").addEventListener("input", () => {
    // 달 선택과 기간검색은 서로 헷갈리므로 한쪽을 고르면 다른 쪽을 비운다.
    if ($("monthFilter").value) { $("fromDate").value = ""; $("toDate").value = ""; }
    resetPaging();
  });
  ["fromDate", "toDate"].forEach(id =>
    $(id).addEventListener("input", () => {
      if ($(id).value) $("monthFilter").value = "";
      resetPaging();
    })
  );
  $("rangeToggle").addEventListener("click", () => {
    $("rangeRow").classList.toggle("show");
    $("rangeToggle").classList.toggle("active", $("rangeRow").classList.contains("show"));
  });
  setStatsHidden(localStorage.getItem(STATS_KEY) === "1");
  $("statsToggle").addEventListener("click", () => {
    const nowHidden = !$("stats").hidden;
    setStatsHidden(nowHidden);
    try { localStorage.setItem(STATS_KEY, nowHidden ? "1" : "0"); } catch (e) { /* 무시 */ }
  });
  $("resetBtn").addEventListener("click", () => {
    $("search").value = "";
    $("categoryFilter").value = "";
    $("monthFilter").value = "";
    $("fromDate").value = "";
    $("toDate").value = "";
    selected.district.clear();
    selected.bizType.clear();
    $("districtMulti").sync();
    $("bizTypeMulti").sync();
    resetPaging();
  });
  document.addEventListener("click", () =>
    document.querySelectorAll(".multi-panel, .insta-panel")
      .forEach(p => (p.hidden = true))
  );

  openTab("opened");
}

fetch("data/latest.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(init)
  .catch(() => {
    $("period").textContent = "데이터를 불러오지 못했습니다. (data/latest.json 확인 필요)";
  });
</script>
</body>
</html>
